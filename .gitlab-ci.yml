# =============================================================================
#  GitLab CI — RAGFlow Cyllene fork (ragnarok)
# -----------------------------------------------------------------------------
#  Three-stage pipeline:
#    1. lint  — helm lint + ruff (no infra needed, fast feedback)
#    2. test  — AST + unit invariants from test/multitenant/ (no backend)
#    3. build — kaniko image build → Harbor (only on main / tags)
#
#  ArgoCD watches the GitLab project's `main` branch and pulls every ~3 min.
#  We don't trigger ArgoCD from this pipeline; the image push to Harbor +
#  the chart values pinning the image tag are enough — the next ArgoCD reconcile
#  picks up the new image SHA. Add a webhook later if instant deploy matters.
# =============================================================================

variables:
  HARBOR_REGISTRY: harbor.cyllene.local
  HARBOR_PROJECT: ragflow
  IMAGE_NAME: ragflow
  # Pin the kaniko version — `:latest` is a known footgun in CI.
  KANIKO_IMAGE: gcr.io/kaniko-project/executor:v1.23.2-debug
  # Skip git-fetching submodules we don't have.
  GIT_SUBMODULE_STRATEGY: none

stages:
  - lint
  - test
  - build

# -----------------------------------------------------------------------------
# Default settings inherited by every job. The `cyllene-runner` tag is a
# placeholder — adjust to the actual tag of your local on-prem runner.
# -----------------------------------------------------------------------------
default:
  tags:
    - cyllene-runner

# -----------------------------------------------------------------------------
# 1. LINT — fast, runs on every push.
# -----------------------------------------------------------------------------
helm:lint:
  stage: lint
  tags:
    - cylndata-preprod
  image: alpine/helm:3.16.2
  script:
    - helm lint helm/ragflow
    - helm template helm/ragflow --values helm/ragflow/values-cyllene-prod.yaml > /dev/null
  rules:
    - changes:
        - helm/**/*

ruff:check:
  stage: lint
  tags:
    - cylndata-preprod
  image: ghcr.io/astral-sh/uv:0.5.4-debian
  script:
    - uv tool install ruff
    - ruff check api/ rag/ common/
  rules:
    - changes:
        - "**/*.py"
        - pyproject.toml

# -----------------------------------------------------------------------------
# 2. TEST — multitenant invariant suite (AST-only, no backend or DB needed).
# Catches accidental upstream-merge reverts of our custom code.
# -----------------------------------------------------------------------------
pytest:invariants:
  stage: test
  image: ghcr.io/astral-sh/uv:0.5.4-debian
  variables:
    # The bridge suites need RAGFLOW_TEST_LOCAL_AUTH=1 + a running backend;
    # we only run the static-AST tests here that don't.
    PYTHONPATH: $CI_PROJECT_DIR
  script:
    - uv sync --frozen
    - uv run pytest -v
        test/multitenant/test_perf_invariants.py
        test/multitenant/test_rbac_coverage.py
        test/multitenant/test_k8s_runtime_invariants.py
        test/multitenant/test_log_secret_masking.py
        test/multitenant/test_infinity_retry.py
  rules:
    - changes:
        - "**/*.py"
        - pyproject.toml
        - uv.lock

# -----------------------------------------------------------------------------
# 3. BUILD — kaniko image build. Only on `main` (commit SHA tag) and on
# git tags `vX.Y.Z` (semver-aligned).
# -----------------------------------------------------------------------------
.build_template: &build_template
  stage: build
  image:
    name: $KANIKO_IMAGE
    entrypoint: [""]
  before_script:
    # Build the docker auth file kaniko expects. The Harbor robot creds are
    # injected from GitLab CI/CD project variables: HARBOR_USER + HARBOR_PASSWORD.
    # Robot account scope: push to harbor.cyllene.local/ragflow/* only.
    - mkdir -p /kaniko/.docker
    - |
      cat <<EOF >/kaniko/.docker/config.json
      {
        "auths": {
          "$HARBOR_REGISTRY": {
            "auth": "$(printf "%s" "$HARBOR_USER:$HARBOR_PASSWORD" | base64 -w0)"
          }
        }
      }
      EOF
  script:
    - >
      /kaniko/executor
      --context "${CI_PROJECT_DIR}"
      --dockerfile "${CI_PROJECT_DIR}/Dockerfile"
      --destination "${HARBOR_REGISTRY}/${HARBOR_PROJECT}/${IMAGE_NAME}:${IMAGE_TAG}"
      --destination "${HARBOR_REGISTRY}/${HARBOR_PROJECT}/${IMAGE_NAME}:${CI_COMMIT_SHORT_SHA}"
      --cache=true
      --cache-repo "${HARBOR_REGISTRY}/${HARBOR_PROJECT}/${IMAGE_NAME}-cache"
      --cache-ttl=168h
      --snapshot-mode=redo
      --use-new-run

# Build on main → tag the image `cyllene-main-<sha>`. ArgoCD picks up the
# new SHA via the chart's image.tag if you bump it manually, or if you wire
# Argo Image Updater later.
build:main:
  <<: *build_template
  variables:
    IMAGE_TAG: "cyllene-main-${CI_COMMIT_SHORT_SHA}"
  rules:
    - if: $CI_COMMIT_BRANCH == "main"

# Build on git tags `cyllene-vX.Y.Z` → tag the image with the same version.
# This is what we deploy to prod — bump values-cyllene-prod.yaml's
# `global.imageTag` to match the tag at release time.
build:release:
  <<: *build_template
  variables:
    IMAGE_TAG: "${CI_COMMIT_TAG}"
  rules:
    - if: $CI_COMMIT_TAG =~ /^cyllene-v\d+\.\d+\.\d+$/
