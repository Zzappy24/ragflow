variables:
  HARBOR_REGISTRY_PROD: harbor.cylndata.cyllene.pro
  HARBOR_PROJECT: data
  IMAGE_NAME: ragflow
  DOCKER_HOST: tcp://docker:2375
  DOCKER_TLS_CERTDIR: ""
  DOCKER_DRIVER: overlay2

image: docker:27.0.3

services:
  - name: docker:27.0.3-dind
    command: ["--mtu=1460"]

stages:
  - build_prd

buildkit_build_prd:
  stage: build_prd
  tags:
    - cylndata-prod
  before_script:
    - |
      if [ -n "$CI_COMMIT_TAG" ]; then
        echo "Utilisation du tag Git comme tag d'image: $CI_COMMIT_TAG"
        export IMAGE_TAG="$CI_COMMIT_TAG"
      else
        echo "Pas de tag Git. Utilisation du SHA du commit comme tag d'image: $CI_COMMIT_SHORT_SHA"
        export IMAGE_TAG="$CI_COMMIT_SHORT_SHA"
      fi
    - echo "$HARBOR_CYLNDATA_ROBOT_PWD_PRD" | docker login "$HARBOR_REGISTRY_PROD" -u "$HARBOR_CYLNDATA_ROBOT_PRD" --password-stdin
    - docker buildx create --use --name buildkit-builder
    - docker buildx inspect --bootstrap
  script:
    - |
      docker buildx build \
        --file Dockerfile \
        --progress=plain \
        --tag ${HARBOR_REGISTRY_PROD}/${HARBOR_PROJECT}/${IMAGE_NAME}:${IMAGE_TAG} \
        --cache-from type=registry,ref=${HARBOR_REGISTRY_PROD}/${HARBOR_PROJECT}/${IMAGE_NAME}:buildcache \
        --cache-to type=registry,ref=${HARBOR_REGISTRY_PROD}/${HARBOR_PROJECT}/${IMAGE_NAME}:buildcache,mode=max \
        --push \
        .
  when: manual