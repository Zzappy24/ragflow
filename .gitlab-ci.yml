
variables:
  HARBOR_REGISTRY_PROD: harbor.cylndata.cyllene.pro
  HARBOR_PROJECT: data
  IMAGE_NAME: ragflow

image: 
  name: gcr.io/kaniko-project/executor:debug
  entrypoint: [""]

stages:
  - build_prd

kaniko_build_prd:
  stage: build_prd
  tags:
    - cylndata-prod
  script:
      - |
        if [ -n "$CI_COMMIT_TAG" ]; then
          echo "Utilisation du tag Git comme tag d'image: $CI_COMMIT_TAG"
          IMAGE_TAG="$CI_COMMIT_TAG"
        else
          echo "Pas de tag Git. Utilisation du SHA du commit comme tag d'image: $CI_COMMIT_SHORT_SHA"
          IMAGE_TAG="$CI_COMMIT_SHORT_SHA"
        fi
      - set -x
      - echo "{\"auths\":{\"$HARBOR_REGISTRY_PROD\":{\"username\":\"$HARBOR_CYLNDATA_ROBOT_PRD\",\"password\":\"$HARBOR_CYLNDATA_ROBOT_PWD_PRD\"}}}" > /kaniko/.docker/config.json
      - /kaniko/executor --cache=true --context "${CI_PROJECT_DIR}" --dockerfile "Dockerfile" --destination "${HARBOR_REGISTRY_PROD}/${HARBOR_PROJECT}/${IMAGE_NAME}:${IMAGE_TAG}"
  when: manual