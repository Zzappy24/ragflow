# Exposition publique du gateway LiteLLM — UNIQUEMENT /v1/*.
#
# Les clients (Kilo Code / OpenCode / Cline) consomment /v1 avec leur clé
# virtuelle ; l'API de management (/team, /key, /spend, /ui) n'est PAS routée
# et reste cluster-interne — seul le mgmt-backend l'atteint via le Service.
#
# Le hostname ci-dessous = ADMIN_CODE_GATEWAY_PUBLIC_URL (env du mgmt-backend,
# affiché dans le panel + les emails d'invitation) : https://litellm.cyllene.cloud/v1
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: litellm-v1-public
  namespace: rag-new2
spec:
  parentRefs:
    - name: envoy-gateway
      namespace: envoy-gateway-system
  hostnames:
    - litellm.cyllene.cloud
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /v1
      backendRefs:
        - name: litellm
          port: 4000
