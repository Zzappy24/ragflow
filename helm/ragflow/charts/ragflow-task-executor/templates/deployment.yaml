apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "ragflow-task-executor.fullname" . }}
  labels:
    {{- include "ragflow-task-executor.labels" . | nindent 4 }}
spec:
  # Replica count is owned by KEDA's ScaledObject when keda.enabled.
  # spec.replicas seeds the initial rollout; KEDA HPA takes over after.
  {{- if not .Values.keda.enabled }}
  replicas: {{ .Values.replicas }}
  {{- end }}
  revisionHistoryLimit: 3
  strategy:
    # Workers can tolerate brief unavailability — they pop tasks from a
    # durable Redis stream so a few seconds of fewer consumers just delays
    # work, never loses it. RollingUpdate with maxSurge=2 lets us roll
    # quickly without piling up extra pods.
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 25%
      maxSurge: 2
  selector:
    matchLabels:
      {{- include "ragflow-task-executor.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "ragflow-task-executor.selectorLabels" . | nindent 8 }}
      annotations:
        helm.sh/release-revision: {{ .Release.Revision | quote }}
        prometheus.io/scrape: "true"
        prometheus.io/port: "9381"
        prometheus.io/path: "/metrics"
    spec:
      serviceAccountName: {{ include "ragflow-task-executor.fullname" . }}
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- include "ragflow.podSecurityContext" . | nindent 8 }}

      affinity:
        # Spread workers across nodes — losing one node mustn't drop > 50%.
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    {{- include "ragflow-task-executor.selectorLabels" . | nindent 20 }}
                topologyKey: kubernetes.io/hostname
        {{- with .Values.affinity }}
        {{- if .nodeAffinity }}
        nodeAffinity:
          {{- toYaml .nodeAffinity | nindent 10 }}
        {{- end }}
        {{- if .podAffinity }}
        podAffinity:
          {{- toYaml .podAffinity | nindent 10 }}
        {{- end }}
        {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}

      # Tasks include long-running parses (PDFs, batches of embeddings).
      # 5 min is enough for the longest legitimate task to finish; longer
      # tasks should checkpoint to Redis and resume on the next pod anyway.
      terminationGracePeriodSeconds: 300

      # See ragflow-api/templates/deployment.yaml for the rationale —
      # RAGFlow reads conf/local.service_conf.yaml, not env vars.
      initContainers:
        - name: render-service-conf
          image: alpine:3.20
          command:
            - sh
            - -c
            - |
              apk add --no-cache gettext >/dev/null 2>&1 || true
              envsubst < /conf-template/service_conf.yaml.template > /conf-rendered/local.service_conf.yaml
          envFrom:
            - configMapRef:
                name: {{ .Release.Name }}-app-config
            - secretRef:
                name: ragflow-app-secrets
          volumeMounts:
            - name: conf-template
              mountPath: /conf-template
              readOnly: true
            - name: conf-rendered
              mountPath: /conf-rendered

      containers:
        - name: task-executor
          image: {{ include "ragflow-task-executor.image" . }}
          imagePullPolicy: {{ .Values.global.imagePullPolicy | default .Values.image.pullPolicy }}

          # task_executor.py uses argparse flags `-i <index> -t <type>`
          # (upstream 2026-06-02 switched away from a positional worker name).
          # CONSUMER_NAME becomes `task_executor_<type>_<index>`, so we pass
          # POD_NAME as the index to keep per-replica uniqueness in the Redis
          # stream's consumer group (two pods sharing a name would race).
          command: ["/bin/bash", "-lc"]
          args:
            - |
              exec python rag/svr/task_executor.py -i "{{ .Values.workerNamePrefix }}_${POD_NAME}"

          # /metrics is exposed on 9381 (set in env via TASK_EXECUTOR_METRICS_PORT)
          # so Prometheus can scrape per-pod counters.
          ports:
            - name: metrics
              containerPort: 9381
              protocol: TCP

          envFrom:
            - configMapRef:
                name: {{ .Release.Name }}-app-config
            - secretRef:
                name: ragflow-app-secrets
          env:
            - name: POD_NAME
              valueFrom: { fieldRef: { fieldPath: metadata.name } }
            - name: POD_IP
              valueFrom: { fieldRef: { fieldPath: status.podIP }}
            - name: PYTHONPATH
              value: "/ragflow"
            - name: TASK_EXECUTOR_METRICS_PORT
              value: "9381"
            # WORKER_RECYCLE_AFTER_TASKS — graceful exit threshold (see
            # rag/svr/task_executor.py for behaviour). 0 = disabled.
            # Distinct from upstream's WORKER_MAX_TASKS which controls
            # in-pod CONCURRENCY (asyncio semaphore size).
            - name: WORKER_RECYCLE_AFTER_TASKS
              value: {{ .Values.recycleAfterTasks | quote }}
            - name: WORKER_HEARTBEAT_FILE
              value: {{ .Values.livenessProbe.heartbeatFile | quote }}

          resources:
            {{- toYaml .Values.resources | nindent 12 }}

          {{- if .Values.livenessProbe.enabled }}
          # Liveness — fails if the worker's heartbeat file hasn't been
          # touched in maxAgeSeconds. Detects stuck loops / deadlocks the
          # OS can't see (PID 1 still alive but useless).
          livenessProbe:
            exec:
              command:
                - sh
                - -c
                - |
                  test -f {{ .Values.livenessProbe.heartbeatFile }} && \
                  test $(( $(date +%s) - $(stat -c %Y {{ .Values.livenessProbe.heartbeatFile }}) )) -lt {{ .Values.livenessProbe.maxAgeSeconds }}
            initialDelaySeconds: {{ .Values.livenessProbe.initialDelaySeconds }}
            periodSeconds: {{ .Values.livenessProbe.periodSeconds }}
            failureThreshold: {{ .Values.livenessProbe.failureThreshold }}
          {{- end }}

          # Phase 0 securityContext — same relaxation as ragflow-api. The
          # task_executor uses sentence-transformers / ocr / pdfminer which
          # write to ~/.cache and various tmpdirs, hence readOnlyRootFilesystem
          # off until Phase 1 hardening.
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]

          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: hf-cache
              mountPath: /home/ragflow/.cache/huggingface
            - name: nltk-data
              mountPath: /home/ragflow/nltk_data
            - name: runtime
              mountPath: /ragflow/logs
            - name: conf-rendered
              mountPath: /ragflow/conf/local.service_conf.yaml
              subPath: local.service_conf.yaml
              readOnly: true

      # Cache emptyDirs sized for 1× model weights worst-case (BGE-M3 ~2GB,
      # NLTK punkt etc < 100MB). On hot pod the cache is reused across tasks
      # so we don't redownload between Redis poll cycles.
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 2Gi
        - name: hf-cache
          emptyDir:
            sizeLimit: 4Gi
        - name: nltk-data
          emptyDir:
            sizeLimit: 200Mi
        - name: runtime
          emptyDir:
            sizeLimit: 2Gi
        - name: conf-template
          configMap:
            name: {{ .Release.Name }}-app-config
            items:
              - key: service_conf.yaml.template
                path: service_conf.yaml.template
        - name: conf-rendered
          emptyDir:
            sizeLimit: 64Mi
