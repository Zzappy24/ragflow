# Task executor — defaults. See umbrella values.yaml for what's actually used.

replicas: 4

image:
  repository: harbor.cylndata.cyllene.pro/data/ragflow
  tag: v0.4
  pullPolicy: IfNotPresent
  imagePullSecrets:
    - name: harbor-pull-secret

externalSecrets:
  enabled: false
  
# Workers are heavier than the api: they load embedding models, OCR weights,
# Infinity client buffers, etc. Per-pod budget reflects that.
resources:
  requests:
    cpu: 500m
    memory: 1500Mi
  limits:
    cpu: 2000m
    memory: 4Gi

# KEDA — scales on Redis stream PEL (Pending Entries List) length, which is
# the most reliable "backlog" signal for our consumer-group setup.
#
# RAGFlow workers consume TWO streams in priority order (see
# common/settings.py::get_svr_queue_names — returns [priority-1, priority-0]).
# We register one KEDA trigger per stream; KEDA scales to satisfy the most
# loaded one (selectPolicy=Max in advanced.behavior).
keda:
  enabled: true
  minReplicas: 4
  maxReplicas: 30
  pollingInterval: 15           # seconds between Redis checks
  cooldownPeriod: 300           # wait 5 min before scaling DOWN
  redisStreams:
    - "rag_flow_svr_queue_1"    # priority 1 — drained first
    - "rag_flow_svr_queue"      # priority 0
  redisConsumerGroup: "rag_flow_svr_task_broker"
  pendingEntriesThreshold: "10" # 1 pod per 10 pending tasks

# Worker name passed to task_executor.py — uniqueness is required per
# pod (consumer name in the Redis stream group).
workerNamePrefix: "k8s_worker"

# Graceful pod recycling — after this many completed+failed tasks the
# worker calls stop_event.set() and exits cleanly; Deployment respawns a
# fresh pod with empty caches and freshly-loaded models.
#
# Why a value at all: third-party libs in the embedding/parsing path
# (sentence-transformers, pdfminer, certain OCR backends) leak memory
# slowly. A periodic recycle bounds RSS growth without shipping a fix
# upstream. 0 = disable the recycling.
#
# 200 picked as the best-practices default (gunicorn/celery convention is
# 100-1000; we lean conservative because each task is heavy: a single PDF
# parse can churn 200+ MB of intermediate state).
recycleAfterTasks: 200

# Liveness probe — exec'd by kubelet, fails if the heartbeat file's mtime
# is older than 90s (workers touch it at the end of every report_status
# loop, period 30s; 90s = 3 missed iterations).
#
livenessProbe:
  enabled: false
#  heartbeatFile: "/tmp/k8s_heartbeat"
#  maxAgeSeconds: 90
#  initialDelaySeconds: 60       # let model loading finish first
#  periodSeconds: 30
#  failureThreshold: 2
