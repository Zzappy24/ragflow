apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "ragflow-api.fullname" . }}
  labels:
    {{- include "ragflow-api.labels" . | nindent 4 }}
spec:
  {{- if not .Values.hpa.enabled }}
  replicas: {{ .Values.replicas }}
  {{- end }}
  revisionHistoryLimit: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      {{- include "ragflow-api.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "ragflow-api.selectorLabels" . | nindent 8 }}
      annotations:
        helm.sh/release-revision: {{ .Release.Revision | quote }}
        prometheus.io/scrape: "true"
        prometheus.io/port: "9380"
        prometheus.io/path: "/metrics"
    spec:
      serviceAccountName: {{ include "ragflow-api.fullname" . }}
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}

      securityContext:
        {{- include "ragflow.podSecurityContext" . | nindent 8 }}

      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}

      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}

      terminationGracePeriodSeconds: 60

      initContainers:
        - name: render-service-conf
          image: alpine:3.20
          command:
            - sh
            - -c
            - |
              set -eux
              apk add --no-cache gettext
              which envsubst
              envsubst < /conf-template/service_conf.yaml.template > /conf-rendered/local.service_conf.yaml
              echo '==== rendered local.service_conf.yaml ===='
              cat /conf-rendered/local.service_conf.yaml
              echo '==== end rendered local.service_conf.yaml ===='
          envFrom:
            - secretRef:
                name: ragflow-app-secrets
            - configMapRef:
                name: {{ .Release.Name }}-app-config
          volumeMounts:
            - name: conf-template
              mountPath: /conf-template
              readOnly: true
            - name: conf-rendered
              mountPath: /conf-rendered

      containers:
        - name: api
          image: {{ include "ragflow-api.image" . }}
          imagePullPolicy: {{ .Values.global.imagePullPolicy | default .Values.image.pullPolicy }}
          command: ["/bin/bash", "-lc"]
          args:
            - |
              exec hypercorn api.asgi:app \
                --bind 0.0.0.0:9380 \
                --workers {{ .Values.hypercornWorkers }} \
                --access-logfile - \
                --error-logfile -
          ports:
            - name: http
              containerPort: 9380
              protocol: TCP

          envFrom:
            - configMapRef:
                name: {{ .Release.Name }}-app-config
            - secretRef:
                name: ragflow-app-secrets
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
            - name: PYTHONPATH
              value: "/ragflow"

          resources:
            {{- toYaml .Values.resources | nindent 12 }}

          startupProbe:
            httpGet:
              path: {{ .Values.probes.startup.path }}
              port: http
            periodSeconds: {{ .Values.probes.startup.periodSeconds }}
            failureThreshold: {{ .Values.probes.startup.failureThreshold }}

          livenessProbe:
            httpGet:
              path: {{ .Values.probes.liveness.path }}
              port: http
            periodSeconds: {{ .Values.probes.liveness.periodSeconds }}
            failureThreshold: {{ .Values.probes.liveness.failureThreshold }}

          readinessProbe:
            httpGet:
              path: {{ .Values.probes.readiness.path }}
              port: http
            periodSeconds: {{ .Values.probes.readiness.periodSeconds }}
            failureThreshold: {{ .Values.probes.readiness.failureThreshold }}

          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]

          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: ragflow-runtime
              mountPath: /ragflow/logs
            - name: conf-rendered
              mountPath: /ragflow/conf/local.service_conf.yaml
              subPath: local.service_conf.yaml
              readOnly: true

      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 1Gi
        - name: ragflow-runtime
          emptyDir:
            sizeLimit: 2Gi
        - name: conf-template
          configMap:
            name: {{ .Release.Name }}-app-config
            items:
              - key: service_conf.yaml.template
                path: service_conf.yaml.template
        - name: conf-rendered
          emptyDir:
            sizeLimit: 64Mi