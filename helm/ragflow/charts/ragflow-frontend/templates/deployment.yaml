apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "ragflow-frontend.fullname" . }}
  labels:
    {{- include "ragflow-frontend.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicas }}
  revisionHistoryLimit: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      {{- include "ragflow-frontend.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "ragflow-frontend.selectorLabels" . | nindent 8 }}
      annotations:
        # Force a restart when the nginx config changes.
        checksum/nginx-config: {{ include (print $.Template.BasePath "/configmap-nginx.yaml") . | sha256sum }}
    spec:
      serviceAccountName: {{ include "ragflow-frontend.fullname" . }}
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- include "ragflow.podSecurityContext" . | nindent 8 }}

      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    {{- include "ragflow-frontend.selectorLabels" . | nindent 20 }}
                topologyKey: kubernetes.io/hostname
        {{- with .Values.affinity }}
        {{- if .nodeAffinity }}
        nodeAffinity:
          {{- toYaml .nodeAffinity | nindent 10 }}
        {{- end }}
        {{- if .podAffinity }}
        podAffinity:
          {{- toYaml .podAffinity | nindent 10 }}
        {{- end }}
        {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}

      containers:
        - name: nginx
          image: {{ include "ragflow-frontend.image" . }}
          imagePullPolicy: {{ .Values.global.imagePullPolicy | default .Values.image.pullPolicy }}
          # The same image bundles the ragflow-api code AND the built web/dist.
          # We override the entrypoint to run nginx in foreground only.
          # ConfigMap is mounted directly at /etc/nginx/conf.d so we don't
          # need a writable / for `cp`. The upstream image's default vhost
          # (`ragflow.conf`) gets shadowed by our subPath mount.
          command: ["/bin/bash", "-lc"]
          args:
            - |
              exec nginx -g 'daemon off;'
          ports:
            - name: http
              containerPort: 80
              protocol: TCP

          resources:
            {{- toYaml .Values.resources | nindent 12 }}

          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: {{ .Values.probes.liveness.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.liveness.periodSeconds }}
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: {{ .Values.probes.readiness.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.readiness.periodSeconds }}

          # Phase 0: relaxed FS — nginx writes to /var/log/nginx and
          # /var/cache/nginx by default in the upstream image, both inside
          # the rootfs. Phase 1 plan: build a custom image with chowned
          # /var/log + /var/cache and re-enable readOnlyRootFilesystem.
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            # readOnlyRootFilesystem: true   # TODO Phase 1

          volumeMounts:
            # Mount our vhost as `ragflow.conf` because the upstream image's
            # nginx.conf includes that exact filename (not a wildcard).
            - name: nginx-config
              mountPath: /etc/nginx/conf.d/ragflow.conf
              subPath: ragflow.conf
              readOnly: true
            # /var/log/nginx and /var/cache/nginx are written to at startup;
            # the image ships them owned by root, but nginx drops to a
            # non-root worker user. emptyDirs let nginx create files there.
            - name: nginx-log
              mountPath: /var/log/nginx
            - name: nginx-cache
              mountPath: /var/cache/nginx
            - name: nginx-run
              mountPath: /var/run

      volumes:
        - name: nginx-config
          configMap:
            name: {{ include "ragflow-frontend.fullname" . }}-nginx
        - name: nginx-log
          emptyDir: {}
        - name: nginx-cache
          emptyDir: {}
        - name: nginx-run
          emptyDir: {}
