# Frontend — defaults. See umbrella values.yaml for actual overrides.

replicas: 2

image:
  repository: harbor.cylndata.cyllene.pro/data/ragflow
  tag: v0.3
  pullPolicy: IfNotPresent
  imagePullSecrets:
    - name: harbor-pull-secret

externalSecrets:
  enabled: false

# Tiny — nginx serves static files, doesn't proxy.
resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 200m
    memory: 256Mi

service:
  type: ClusterIP
  port: 80
  targetPort: 80

probes:
  liveness:
    enabled: false
    #path: /
    #initialDelaySeconds: 5
    #periodSeconds: 10
  readiness:
    enabled: false
    #path: /
    #initialDelaySeconds: 2
    #periodSeconds: 5
