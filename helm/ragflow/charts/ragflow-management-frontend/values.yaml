replicas: 1

# CUSTOM B2B SaaS — the management frontend ships in its own slim
# nginx:alpine image (Dockerfile.management-frontend, ~50 MB) instead
# of being embedded in the 10 GB fat ragflow image. The image helper
# (_helper.tpl) reads repositorySuffix and appends it to the umbrella
# global.imageRepository when set: data/ragflow + suffix → data/ragflow-
# mgmt-frontend:<global.imageTag>.
image:
  repository: harbor.cylndata.cyllene.pro/data/ragflow-mgmt-frontend
  repositorySuffix: "-mgmt-frontend"
  tag: v0.9.17.1
  pullPolicy: IfNotPresent
  imagePullSecrets:
    - name: harbor-pull-secret

hostnameOverride: "ragflow-management.cyllene.cloud"

backend:
  port: 8000

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 250m
    memory: 256Mi

service:
  type: ClusterIP
  port: 80

probes:
  liveness:
    enabled: true
    initialDelaySeconds: 5
    periodSeconds: 10
  readiness:
    enabled: true
    initialDelaySeconds: 2
    periodSeconds: 5
# Nom du listener HTTPS du Gateway partagé pour ce hostname (ex. "https-mgmt").
# Vide = comportement historique (route attachée à tous les listeners, pas de
# redirect 80->443).
httpsListenerName: ""
