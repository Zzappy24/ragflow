apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "ragflow-management-frontend.fullname" . }}
  labels:
    {{- include "ragflow-management-frontend.labels" . | nindent 4 }}
spec:
  parentRefs:
    - name: {{ .Values.global.gatewayName }}
      namespace: {{ .Values.global.gatewayNamespace }}
      {{- if .Values.httpsListenerName }}
      sectionName: {{ .Values.httpsListenerName }}
      {{- end }}
  hostnames:
    - {{ include "ragflow-management-frontend.hostname" . | quote }}
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: {{ include "ragflow-management-frontend.fullname" . }}
          port: {{ .Values.service.port }}{{- if .Values.httpsListenerName }}
---
# Redirect 80 -> 443 pour le panel (voir gateway-httproute.yaml du chart
# parent pour la logique de séparation des listeners).
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "ragflow-management-frontend.fullname" . }}-https-redirect
  labels:
    {{- include "ragflow-management-frontend.labels" . | nindent 4 }}
spec:
  parentRefs:
    - name: {{ .Values.global.gatewayName }}
      namespace: {{ .Values.global.gatewayNamespace }}
      sectionName: web
  hostnames:
    - {{ include "ragflow-management-frontend.hostname" . | quote }}
  rules:
    - filters:
        - type: RequestRedirect
          requestRedirect:
            scheme: https
            statusCode: 301
{{- end }}
