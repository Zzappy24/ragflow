apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "ragflow-management-frontend.fullname" . }}-nginx
  labels:
    {{- include "ragflow-management-frontend.labels" . | nindent 4 }}
data:
  ragflow.conf.template: |
    upstream management_backend {
      server ${MANAGEMENT_BACKEND_SERVICE}.${POD_NAMESPACE}.svc.cluster.local:${MANAGEMENT_BACKEND_PORT};
      keepalive 32;
    }

    server {
      listen 80;
      server_name _;
      root /ragflow/management/web/dist;
      index index.html;

      location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
      }

      location /api/admin/ {
        proxy_pass http://management_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
      }

      location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
      }

      location = /healthz {
        access_log off;
        return 200 'ok';
      }
    }