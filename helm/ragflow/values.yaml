# =============================================================================
#  RAGFlow umbrella chart — defaults
# -----------------------------------------------------------------------------
#  This file holds documented defaults. Per-environment overrides live in
#  values-<env>.yaml (e.g. values-cyllene-prod.yaml).
#
#  Convention: every cluster-specific value (storage class, gateway class,
#  registry hostname, etc.) MUST be parameterised here, never hard-coded in
#  templates. The same chart deploys to staging and prod with only the values
#  file changing.
# =============================================================================

# --- global ------------------------------------------------------------------
# Shared by all sub-charts. Sub-chart values override these only when set.
global:
  # Container image registry. In prod this is the Cyllene Harbor instance.
  imageRegistry: "harbor.cyllene.local"
  imageRepository: "ragflow/ragflow"
  imageTag: "cyllene-1.0.0"
  imagePullPolicy: IfNotPresent
  # ImagePullSecret created from External Secrets pulling Harbor robot creds.
  imagePullSecrets:
    - name: harbor-pull-secret

  # Storage class used for every PVC (MariaDB, Redis, MinIO drives, Infinity).
  # On Cyllene cluster only `rook-ceph-block-alterai-cyllene` is available
  # (RWO). RWX would be needed if we wanted Infinity multi-replica with shared
  # storage — for Phase 0 we run Infinity in single-replica mode on RBD.
  storageClass: "rook-ceph-block-alterai-cyllene"

  # Envoy Gateway is the cluster ingress controller. Templates render
  # `Gateway` + `HTTPRoute` resources rather than legacy `Ingress`.
  gatewayClassName: "envoy"
  # Gateway resource the HTTPRoutes attach to. Created cluster-wide once.
  gatewayName: "envoy-gateway"
  gatewayNamespace: "envoy-gateway-system"

  # External hostname. Multi-tenant uses workspace selection via the
  # X-Workspace-Id header — NOT subdomain-per-client. A single hostname.
  hostname: "ragflow.alterai.cyllene.com"
  # cert-manager ClusterIssuer that signs the public TLS cert.
  tlsClusterIssuer: "letsencrypt-cyllene"

  # Environment shared by every workload. Anything secret goes through
  # ExternalSecret (see externalSecrets: below), NEVER inline here.
  env:
    DOC_ENGINE: "infinity"
    LIGHTEN: "0"
    TZ: "Europe/Paris"

  # Tighter PSS baseline (runAsUser:10001, etc.). Off in Phase 0 because
  # the upstream image's venv is owned by root. See top-level `security:`.
  security:
    restricted: false

  # Pod-level automountServiceAccountToken override for ragflow-api and
  # ragflow-task-executor. Both SAs are created with
  # `automountServiceAccountToken: false` (least privilege — neither
  # normally talks to the K8s API). The k8s sandbox provider needs the
  # task-executor pod to hold its SA token in-cluster to create/watch/
  # delete sandbox Jobs (see sandbox.enabled below) — the pod-level field
  # wins over the SA-level field, so flip this to true only when the
  # sandbox provider is active.
  sandboxTokenAutomount: false

  # Taille max d'un fichier uploadé (HTTP body Quart + validation DOC_MAXIMUM_SIZE).
  # Lue par ragflow-api ET ragflow-task-executor (common/settings.py). 1 GiB.
  maxContentLength: "1073741824"

# --- gateway -------------------------------------------------------------
gateway:
  # Timeout de la route /api|/v1 — uploads volumineux (1 GiB à ~10 Mbps ≈ 14 min → 900s
  # couvre un lien correct) ET streaming SSE. Était hardcodé 600s.
  apiTimeout: "900s"

# --- ragflow-api -------------------------------------------------------------
# K8s-native: 1 worker per pod, scale through replica count. See
# `charts/ragflow-api/values.yaml` for rationale.
ragflow-api:
  enabled: true
  replicas: 2
  hypercornWorkers: 1
  resources:
    requests:
      cpu: "250m"
      memory: "512Mi"
    limits:
      cpu: "1000m"
      memory: "2Gi"
  hpa:
    enabled: true
    minReplicas: 4
    maxReplicas: 30
    targetCPUUtilizationPercentage: 70
    targetMemoryUtilizationPercentage: 80

# --- ragflow-task-executor ---------------------------------------------------
# Scaling is driven by KEDA on Redis stream length (`rag_flow_svr_queue:1`),
# NOT CPU. CPU stays low while waiting on embedding/parse — Redis backlog is
# the real signal of "we need more workers".
ragflow-task-executor:
  enabled: true
  replicas: 2                    # KEDA scales 2..20
  resources:
    requests:
      cpu: "1000m"
      memory: "4Gi"
    limits:
      cpu: "4000m"
      memory: "12Gi"
  keda:
    enabled: true
    minReplicas: 2
    maxReplicas: 20
    redisStream: "rag_flow_svr_queue:1"
    redisStreamPendingThreshold: 10   # pods+1 when XLEN > N

# --- ragflow-frontend --------------------------------------------------------
ragflow-frontend:
  enabled: true
  replicas: 2
  resources:
    requests:
      cpu: "100m"
      memory: "128Mi"
    limits:
      cpu: "500m"
      memory: "512Mi"

# --- mariadb (operator CR) ---------------------------------------------------
# Provisioned by mariadb-operator. The operator installs separately; this
# chart only declares the MariaDB resource it should reify.
mariadb:
  enabled: true
  storage: "20Gi"
  replicas: 2
  galera: true
  metrics: true
  maxUserConnections: 300   # voir commentaire dans mariadb-cluster.yaml
  rootPasswordSecretRef: "ragflow-mariadb-root"
  databaseSecretRef: "ragflow-mariadb-app"
  resources:
    requests: { cpu: "500m", memory: "2Gi" }
    limits:   { cpu: "2000m", memory: "8Gi" }

# --- redis (operator CR) -----------------------------------------------------
redis:
  enabled: true
  storage: "5Gi"
  masterReplicas: 1
  slaveReplicas: 2
  sentinelReplicas: 3
  authSecretRef: "ragflow-redis-auth"
  resources:
    requests: { cpu: "200m", memory: "512Mi" }
    limits:   { cpu: "1000m", memory: "2Gi" }

# --- minio (operator Tenant CR) ----------------------------------------------
# 4 servers × 1 drive = EC4+0 (no parity, fast). Move to 4×4 EC4+2 once
# storage budget allows real durability. Per MinIO best-practice, every
# drive gets its own PVC (no RWX needed).
minio:
  enabled: true
  servers: 2
  volumesPerServer: 1
  size: "100Gi"
  rootCredentialsSecretRef: "ragflow-minio-root"
  resources:
    requests: { cpu: "500m", memory: "1Gi" }
    limits:   { cpu: "2000m", memory: "4Gi" }

# --- infinity (custom StatefulSet, no operator) ------------------------------
# Phase 0: 1 replica, RWO RBD. Phase 2 plan: rework to multi-replica when
# CephFS RWX is available cluster-wide (admin-side change).
infinity:
  enabled: true
  replicas: 1
  storage: "50Gi"
  # v0.7.3 : corrige le deadlock de l'inverted index (#3409) qui gelait les
  # commits / segfaultait sous ingestion massive (incidents 2026-08-19/20).
  # Migration in-place validée en local le 2026-08-20 : la v0.7.3 rejoue le
  # WAL/checkpoints écrits par dev5 sans perte (dev5 écrivait déjà le format
  # CHECKPOINT_V2). ATTENTION : le protocole SDK est couplé (0.7.3 ↔ 0.7.3,
  # rejets croisés) — déployer serveur ET images clientes dans le même sync.
  # Tags upstream par architecture depuis 0.7.1 (pas de manifest multi-arch) :
  # x64-v2 = baseline sûre, x64-v3 = AVX2 (mieux en vectoriel, cf. values-alterai).
  # Les images arm64 0.7.1+ sont cassées upstream (glibc 2.38 manquante).
  image: "infiniflow/infinity:v0.7.3-x64-v2"
  # Plafond de sessions thrift serveur (défaut image : 128). Les clients en
  # read-timeout laissent des sessions zombies (pas de reaper serveur —
  # infiniflow/infinity#3418) : 128 sature en minutes sous charge dégradée.
  connectionPoolSize: 512
  bufferManagerSize: "8GB"
  # Mode « fenêtre de maintenance » : monter optimizeInterval/compactInterval
  # (~24h) et activer le CronJob nocturne qui fait optimize+compact table par
  # table quand personne n'écrit — la maintenance périodique d'Infinity est
  # une txn OCC qui percute les écritures (infiniflow/infinity#3418).
  maintenance:
    enabled: false
    schedule: "0 1 * * *"   # 01:00 tous les jours
  resources:
    requests: { cpu: "1000m", memory: "4Gi" }
    limits:   { cpu: "4000m", memory: "16Gi" }

# --- Elasticsearch (moteur doc alternatif — bench 2026-08 / migration) -------
# Désactivé par défaut : la prod tourne sur Infinity. Activer avec
# DOC_ENGINE=elasticsearch (global.env) + infinity.enabled=false dans la
# release qui l'utilise (voir values-bench-es.yaml). Le code force
# exclude_source_vectors=false au create_idx (requis en ES 9.x, image
# ≥ v0.9.15 obligatoire — grep CUSTOM B2B SaaS — ES 9.x exclude_source_vectors).
elasticsearch:
  enabled: false
  version: "9.5.2"
  # Mot de passe basic auth du superuser `elastic`. Intra-namespace only —
  # même modèle que le compose upstream. À surcharger par env.
  password: "infini_rag_flow"
  storage: "100Gi"
  # Heap explicite ; le reste de la limite mémoire sert de page cache Lucene
  # (règle ES : heap ≤ 50% de la RAM disponible, jamais > 31Go).
  javaOpts: "-Xms4g -Xmx4g"
  resources:
    requests: { cpu: "1000m", memory: "6Gi" }
    limits:   { cpu: "4000m", memory: "12Gi" }
  nodeSelector: {}

# --- vLLM endpoint (NOT deployed by this chart, just configured) -------------
# vLLM lives in its own ns (`vllm-rag` or shared `gpt`/`glm`) and is shared
# infra. We just point ragflow-api at its Service URLs.
vllm:
  chatBaseUrl: "http://vllm-chat.vllm-rag.svc.cluster.local:8000/v1"
  embedBaseUrl: "http://vllm-embed.vllm-rag.svc.cluster.local:8000/v1"
  rerankBaseUrl: "http://vllm-rerank.vllm-rag.svc.cluster.local:8000/v1"
  chatModel: "meta-llama/Llama-3.3-70B-Instruct-FP8"
  embedModel: "BAAI/bge-m3"
  rerankModel: "BAAI/bge-reranker-v2-m3"

# --- external-secrets / Vault ------------------------------------------------
# All secrets sourced from Vault via ExternalSecrets Operator. The chart
# creates `ExternalSecret` CRs that materialise as standard Kubernetes
# Secrets which the workloads then `envFrom`/`volumeMount`.
externalSecrets:
  enabled: true
  clusterSecretStore: "vault-cyllene"
  vaultPathPrefix: "secret/data/ragflow/cyllene-prod"
  refreshInterval: "1h"

# --- networkpolicy -----------------------------------------------------------
# Calico-compatible. Default-deny + explicit allow.
networkPolicy:
  enabled: true
  # Pods authorized to reach ragflow-api on its Service port.
  apiAllowedFrom:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: envoy-gateway-system
    # Workspace admin panel (separate deployment we may add later).
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: ragflow-admin

# --- monitoring --------------------------------------------------------------
monitoring:
  serviceMonitor:
    enabled: true
    interval: "30s"
    scrapeTimeout: "10s"
    namespace: "monitoring"
  # Grafana dashboards shipped in the chart (configmap with dashboard json).
  dashboards:
    enabled: true

# --- security ----------------------------------------------------------------
# Toggle the restricted PSS baseline. When false (Phase 0), pods stay as
# default user (root in the upstream image's venv). When true, pods run
# non-root — REQUIRES the image to chown /ragflow/.venv to UID 10001 at
# build time, otherwise hypercorn / python interpreters trip "Permission
# denied" on their shebang. Tracked in CLAUDE.md Phase 1 hardening.
#
# Defined under both top-level and global so sub-charts can read it via
# `$.Values.global.security`.
security:
  restricted: false

# --- audit (RGPD) ------------------------------------------------------------
# All write actions are recorded into the application's `cyllene_audit_log`
# table; the chart only ensures retention by sizing MariaDB storage above.
# Deletion of a workspace must remove every row — see the multi-tenant test
# suite (`test/multitenant/`) for the contract.
audit:
  retentionDays: 365

# --- sandbox (k8s code-execution provider) ------------------------------------
# Namespace + RBAC + NetworkPolicy + ResourceQuota for the k8s sandbox
# provider (agent CodeExec tool: one-shot Jobs, isolated from the rest of
# the cluster). `enabled: false` renders NONE of templates/sandbox/* — this
# is the default until the provider is wired into task-executor.
sandbox:
  enabled: false
  namespace:
    name: "rag-sandbox"
    create: true
  image:
    repository: ""        # ex prod: harbor.cylndata.cyllene.pro/data/ragflow-sandbox-python
    tag: ""
  # Name of the imagePullSecret (in the sandbox namespace) referenced by the
  # sandbox Jobs. Provisioning is separate: rendered by templates/sandbox/
  # externalsecret-pull.yaml when externalSecrets.enabled, otherwise created
  # out-of-band (one-time copy — see PRODUCTION_NOTES.md).
  imagePullSecret: ""
  limits:
    memory: "1Gi"
    cpu: "1"
  quota:
    memory: "8Gi"
    cpu: "8"
    pods: "20"
  networkPolicy:
    enabled: true
    # Namespace + pod selector of the platform's MinIO service (egress
    # allowed so sandboxed code can read/write workspace files). Generic
    # placeholder here — see values-alterai.yaml for the real cluster
    # selector (minio-operator labels pods `v1.min.io/tenant: <tenant>`,
    # confirmed against templates/minio-tenant.yaml + templates/
    # networkpolicy.yaml in this same chart).
    minioNamespace: "rag-new2"
    minioPodSelector:
      app: minio
    minioPort: 9000
    extraEgress: []       # extra egress blocks (future FAMAT base)
