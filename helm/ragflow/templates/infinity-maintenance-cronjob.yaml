{{- if .Values.infinity.maintenance.enabled }}
# Fenêtre de maintenance Infinity — compact + optimize de toutes les tables
# la nuit, quand personne n'écrit, SUIVIS D'UN RESTART du pod Infinity.
# Complément du mode « intervalles longs » (infinity.optimizeInterval /
# compactInterval ~24h dans values) : la maintenance périodique d'Infinity
# est une transaction OCC qui percute les écritures (incidents 2026-08-19/20,
# infiniflow/infinity#3418) — on la sort du chemin de jour.
#
# LE RESTART FINAL EST NON NÉGOCIABLE (audits 2026-08-28, deux analyses
# convergentes — docs/known-issues/infinity-ft-cleanup-uaf.md) :
#   * COMPACT/IMPORT n'invalident jamais le cache de readers fulltext →
#     résultats silencieusement périmés jusqu'à purge ;
#   * le cleanup chunk-level n'invalide pas non plus (PR upstream #3423) ;
#   * seul un restart purge TableIndexReaderCache + le cache mmap.
# Le pod revient en ~3-4 min (replay WAL) dans la fenêtre calme.
# Désactivable via infinity.maintenance.restartAfter: false (déconseillé
# tant que l'image patchée v0.7.3-cyllene n'est pas déployée).
#
# Après un gros run d'ingestion, déclenchement manuel possible :
#   kubectl -n <ns> create job --from=cronjob/{{ .Release.Name }}-infinity-maintenance manual-$(date +%s)
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Release.Name }}-infinity-maintenance
  labels:
    {{- include "ragflow.labels" . | nindent 4 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ .Release.Name }}-infinity-maintenance
  labels:
    {{- include "ragflow.labels" . | nindent 4 }}
rules:
  # Strictement le pod Infinity : delete (recycle) + get (attente du retour).
  - apiGroups: [""]
    resources: ["pods"]
    resourceNames: ["{{ .Release.Name }}-infinity-0"]
    verbs: ["get", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ .Release.Name }}-infinity-maintenance
  labels:
    {{- include "ragflow.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ .Release.Name }}-infinity-maintenance
subjects:
  - kind: ServiceAccount
    name: {{ .Release.Name }}-infinity-maintenance
    namespace: {{ .Release.Namespace }}
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ .Release.Name }}-infinity-maintenance
  labels:
    {{- include "ragflow.labels" . | nindent 4 }}
spec:
  schedule: {{ .Values.infinity.maintenance.schedule | quote }}
  concurrencyPolicy: Forbid          # jamais deux maintenances en parallèle
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      activeDeadlineSeconds: 7200    # grosse table = long ; 2h de plafond
      backoffLimit: 1
      template:
        metadata:
          labels:
            app.kubernetes.io/name: ragflow
            app.kubernetes.io/instance: {{ .Release.Name }}
            app.kubernetes.io/component: infinity-maintenance
        spec:
          restartPolicy: Never
          serviceAccountName: {{ .Release.Name }}-infinity-maintenance
          {{- with .Values.global.imagePullSecrets }}
          imagePullSecrets:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          # Séquencement garanti par initContainers : la maintenance d'abord,
          # le restart ensuite — si la maintenance échoue, pas de restart
          # (le pod n'a alors rien de nouveau à purger).
          initContainers:
            - name: maintenance
              image: "{{ .Values.global.imageRegistry }}/{{ .Values.global.imageRepository }}:{{ .Values.global.imageTag }}"
              imagePullPolicy: IfNotPresent
              command: ["python", "tools/scripts/infinity_nightly_maintenance.py"]
              env:
                - name: INFINITY_HOST
                  value: "{{ .Release.Name }}-infinity.{{ .Release.Namespace }}.svc.cluster.local"
                - name: INFINITY_THRIFT_PORT
                  value: "23817"
              resources:
                requests:
                  cpu: 100m
                  memory: 256Mi
                limits:
                  cpu: "1"
                  memory: 1Gi
          containers:
            - name: restart-infinity
              image: bitnami/kubectl:1.31
              imagePullPolicy: IfNotPresent
              command: ["/bin/sh", "-c"]
              args:
                - |
                  {{- if ne (toString (.Values.infinity.maintenance.restartAfter | default true)) "false" }}
                  set -e
                  POD="{{ .Release.Name }}-infinity-0"
                  echo "post-maintenance: recycling $POD (purge des caches readers/mmap périmés)"
                  kubectl -n {{ .Release.Namespace }} delete pod "$POD" --wait=false
                  # attendre le retour Ready (replay WAL ~3-4 min ; plafond 15 min)
                  for i in $(seq 1 90); do
                    phase=$(kubectl -n {{ .Release.Namespace }} get pod "$POD" -o jsonpath='{.status.containerStatuses[0].ready}' 2>/dev/null || echo "")
                    [ "$phase" = "true" ] && { echo "infinity Ready — maintenance complète"; exit 0; }
                    sleep 10
                  done
                  echo "WARN: infinity pas Ready après 15 min — vérifier le replay WAL" >&2
                  exit 1
                  {{- else }}
                  echo "restartAfter=false — restart sauté (déconseillé tant que l'image patchée n'est pas déployée)"
                  {{- end }}
              resources:
                requests:
                  cpu: 50m
                  memory: 64Mi
                limits:
                  cpu: 200m
                  memory: 128Mi
{{- end }}
