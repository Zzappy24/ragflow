{{- if .Values.mariadb.enabled }}
# MariaDB Operator CR — provisioned by mariadb-operator/mariadb-operator.
# Galera 3-replica cluster: any node failure tolerated, write-anywhere.
# Operator handles bootstrap, replication, automated backups, and TLS.
#
# Operator install: helm/operators/mariadb-operator (separate ArgoCD app).
# CRD reference: https://github.com/mariadb-operator/mariadb-operator
apiVersion: k8s.mariadb.com/v1alpha1
kind: MariaDB
metadata:
  name: {{ .Release.Name }}-mariadb
  labels:
    {{- include "ragflow.labels" . | nindent 4 }}
spec:
  rootPasswordSecretKeyRef:
    name: {{ .Values.mariadb.rootPasswordSecretRef }}
    key: password

  # Application user / database — created on first boot. peewee/RAGFlow
  # connects with these creds (host/port/db wired via configmap-app.yaml).
  username: ragflow
  passwordSecretKeyRef:
    name: {{ .Values.mariadb.databaseSecretRef }}
    key: password
  database: ragflow

  # Galera replication — 3 nodes is the minimum for split-brain protection
  # (quorum = 2). Bumping to 5 buys nothing for a workload our size.
  replicas: {{ .Values.mariadb.replicas }}
  {{- if .Values.mariadb.galera }}
  galera:
    enabled: true
    sst: mariabackup        # state snapshot transfer — faster than rsync on TB-scale
    replicaThreads: 4
  {{- end }}

  storage:
    size: {{ .Values.mariadb.storage }}
    storageClassName: {{ .Values.global.storageClass | quote }}

  # Server config tuned for RAGFlow's profile: many small connections from
  # api pods + a handful of long-running ones from task_executor.
  myCnf: |
    [mysqld]
    bind-address = 0.0.0.0
    default_storage_engine = InnoDB
    innodb_buffer_pool_size = 1G
    max_connections = 500
    transaction-isolation = READ-COMMITTED
    binlog_format = ROW
    # peewee uses utf8mb4 — ensure DB defaults match.
    character-set-server = utf8mb4
    collation-server = utf8mb4_unicode_ci

  resources:
    {{- toYaml .Values.mariadb.resources | nindent 4 }}

  {{- if .Values.mariadb.metrics }}
  # Prometheus exporter sidecar — scraped by the cluster Prometheus.
  metrics:
    enabled: true
    serviceMonitor:
      enabled: true
      interval: 30s
  {{- end }}

  # Connection pooling sidecar — MaxScale would be even better but adds an
  # operator. The built-in `connection` lets ragflow-api hit a stable
  # endpoint while Galera nodes come/go.
  podDisruptionBudget:
    maxUnavailable: 1
---
# Per-user connection cap for the app user. MariaDB.spec has no
# maxUserConnections field on this operator version (CRD rejects it) — the
# User CR owns account-level settings instead: it adopts the bootstrap
# 'ragflow'@'%' user and reconciles `ALTER USER … MAX_USER_CONNECTIONS`.
# Why: the operator bootstrap default (20) starves our topology — 3
# task-executors × DB_POOL_SIZE(16) + api pods — under bulk ingestion; every
# excess connection fails parses with "(1226) exceeded max_user_connections"
# (incident 2026-08-19, calibration CRAG 962 docs: parsing stalled at 32 DONE).
# Keep below myCnf max_connections (500) so root/exporter always connect.
# CAUTION: deleting this CR may DROP the user on some operator versions —
# it must live and die with the MariaDB CR itself.
#
# CAUTION 2 — DUAL-CR CONFLICT (incident 2026-08-27, parent-child re-parse):
# the operator ALSO auto-generates a User CR (`<mariadb>-user`, e.g.
# rag-new2-mariadb-user) from the MariaDB.spec bootstrap, with its default
# maxUserConnections=20, managing the SAME SQL user 'ragflow'@'%'. Two
# reconcilers fight over one grant — last writer wins, and prod ended up
# LIVE at 20 despite this CR saying 300 (5 docs FAILed with (1226) during
# a 960-doc wave). Fix on cluster (idempotent, no GitOps drift — that CR
# is operator-generated, untracked by ArgoCD):
#   kubectl -n <ns> patch user <mariadb>-user --type merge \
#     -p '{"spec":{"maxUserConnections":300}}'
# Verify: both rows of `kubectl get users.k8s.mariadb.com` must show 300,
# and `SELECT max_user_connections FROM mysql.user WHERE User='ragflow'`.
apiVersion: k8s.mariadb.com/v1alpha1
kind: User
metadata:
  name: ragflow
  labels:
    {{- include "ragflow.labels" . | nindent 4 }}
spec:
  mariaDbRef:
    name: {{ .Release.Name }}-mariadb
  passwordSecretKeyRef:
    name: {{ .Values.mariadb.databaseSecretRef }}
    key: password
  host: "%"
  maxUserConnections: {{ .Values.mariadb.maxUserConnections | default 300 }}
{{- end }}
