# Non-secret runtime config consumed by ragflow-api and ragflow-task-executor.
# Anything secret (passwords, tokens, RSA keys) goes through ExternalSecret
# (templates/externalsecret-app.yaml) and lands in `ragflow-app-secrets`.
#
# Hosts use Kubernetes DNS — `<svc>.<ns>.svc.cluster.local` resolves to the
# operator-managed Service. The operator is responsible for keeping that
# Service in sync with the actual pods.
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-app-config
  labels:
    {{- include "ragflow.labels" . | nindent 4 }}
data:
  # --- core ----------------------------------------------------------------
  DOC_ENGINE: {{ .Values.global.env.DOC_ENGINE | quote }}
  LIGHTEN: {{ .Values.global.env.LIGHTEN | default "0" | quote }}
  TZ: {{ .Values.global.env.TZ | default "Europe/Paris" | quote }}
  # 0 = disable /register endpoint so only admin-panel-created users exist.
  # Critical for B2B SaaS: a self-registered user lands without org/ws
  # membership and ends up invisible to the admin panel while blocking
  # re-creation under the same email.
  REGISTER_ENABLED: {{ .Values.global.env.REGISTER_ENABLED | default "0" | quote }}

  # CUSTOM B2B SaaS — shared secret for service-to-service internal
  # endpoints (currently used by the slim management backend to proxy
  # model verify calls to ragflow-api, which has rag.llm installed).
  # Not a primary security boundary — the K8s NetworkPolicy that restricts
  # cluster-internal traffic is. This is defense-in-depth.
  # Override via .Values.global.env.INTERNAL_API_SECRET in values-<env>.yaml.
  # Default value is intentionally NOT empty so a forgotten override doesn't
  # leave the endpoint open to any unauthenticated caller inside the cluster.
  INTERNAL_API_SECRET: {{ .Values.global.env.INTERNAL_API_SECRET | default "change-me-in-prod-set-via-values" | quote }}

  # --- MariaDB (mariadb-operator) ------------------------------------------
  # Operator publishes a Service named exactly after the MariaDB CR
  # (`<MariaDB.metadata.name>`). Galera primary writes go to this Service;
  # `<name>-internal` is the headless Service for replica discovery.
  MYSQL_HOST: "{{ .Release.Name }}-mariadb.{{ .Release.Namespace }}.svc.cluster.local"
  MYSQL_PORT: "3306"
  MYSQL_DBNAME: "ragflow"
  MYSQL_USER: "ragflow"
  # MYSQL_PASSWORD comes from ragflow-app-secrets (Vault)

  # --- Redis (redis-operator OT) -------------------------------------------
  # OT operator publishes Services named `<RedisReplication.metadata.name>`
  # (primary writes), `-additional` (replica reads), `-headless` (peer
  # discovery). We use the writable primary endpoint.
  REDIS_HOST: "{{ .Release.Name }}-redis.{{ .Release.Namespace }}.svc.cluster.local"
  REDIS_PORT: "6379"
  # KEDA's redis-streams scaler reads $REDIS_ADDRESS in host:port form.
  REDIS_ADDRESS: "{{ .Release.Name }}-redis.{{ .Release.Namespace }}.svc.cluster.local:6379"
  # REDIS_PASSWORD comes from ragflow-app-secrets (Vault)

  # --- MinIO (minio-operator) ----------------------------------------------
  MINIO_HOST: {{ .Values.minio.host | quote }}
  MINIO_USE_SSL: "false"
  # MINIO_USER + MINIO_PASSWORD come from ragflow-app-secrets

  # --- Infinity (custom StatefulSet) ---------------------------------------
  INFINITY_HOST: "{{ .Release.Name }}-infinity.{{ .Release.Namespace }}.svc.cluster.local"
  INFINITY_THRIFT_PORT: "23817"
  INFINITY_HTTP_PORT: "23820"
  INFINITY_PSQL_PORT: "5432"

  # --- vLLM (external service, not deployed by this chart) -----------------
  # Pointed at by tenant_llm_service when a workspace selects the cluster
  # default model.
  VLLM_CHAT_BASE_URL: {{ .Values.vllm.chatBaseUrl | quote }}
  VLLM_EMBED_BASE_URL: {{ .Values.vllm.embedBaseUrl | quote }}
  VLLM_RERANK_BASE_URL: {{ .Values.vllm.rerankBaseUrl | quote }}
  VLLM_CHAT_MODEL: {{ .Values.vllm.chatModel | quote }}
  VLLM_EMBED_MODEL: {{ .Values.vllm.embedModel | quote }}
  VLLM_RERANK_MODEL: {{ .Values.vllm.rerankModel | quote }}

  {{- if .Values.sandbox.enabled }}
  # --- sandbox k8s provider (GitOps-managed image) -------------------------
  # The provider (agent/sandbox/providers/k8s.py) reads these envs with
  # precedence over its DB config (system_settings sandbox.k8s): bumping
  # sandbox.image.tag in values + ArgoCD sync rolls the sandbox image like
  # every other image — no SQL to touch. The one-time SQL bootstrap only
  # sets provider_type=k8s + resource limits.
  SANDBOX_IMAGE: "{{ .Values.sandbox.image.repository }}:{{ .Values.sandbox.image.tag }}"
  SANDBOX_NAMESPACE: {{ .Values.sandbox.namespace.name | quote }}
  {{- with .Values.sandbox.imagePullSecret }}
  SANDBOX_IMAGE_PULL_SECRET: {{ . | quote }}
  {{- end }}
  {{- end }}

  # --- pool sizes (see CLAUDE.md project_k8s_env_vars memo) ----------------
  DB_POOL_SIZE: "16"
  REDIS_POOL_SIZE: "32"
  EMBEDDING_BATCH_SIZE: "512"
  # Timeout RPC Infinity : 300s (défaut code 120s). Un insert lent qui
  # timeout est REJOUÉ par le SDK pendant que le serveur exécute encore le
  # premier — la duplication aggrave la lenteur (boule de neige 2026-08-20).
  # Mieux vaut attendre un insert lent que le doubler.
  INFINITY_RPC_TIMEOUT_MS: "300000"
  # TTL des slots d'écriture par table : doit rester > au timeout RPC, sinon
  # un slot expire pendant un insert légitime encore en vol et un 3e écrivain
  # entre — la garantie du sémaphore saute.
  INFINITY_TABLE_WRITE_SLOT_TTL_S: "360"
  # 512 (défaut code : 128) — moins d'inserts Infinity mais plus gros : 128
  # fragmentait la table en milliers de petits segments sous ingestion
  # massive → boucle de compaction (même ts rejoué), inserts en read timeout
  # (incident 2026-08-19, calibration CRAG 962 docs × 12 threads).
  DOC_BULK_SIZE: "512"
  INFINITY_POOL_SIZE: "0"        # 0 = auto-size from WORKER_MAX_TASKS
{{- if .Values.elasticsearch.enabled }}
  # Résolu par envsubst dans la section es: du template ci-dessous.
  ELASTIC_PASSWORD: {{ .Values.elasticsearch.password | quote }}
  # CUSTOM B2B SaaS — shards/réplicas des index créés par l'application (un
  # index par workspace). Lus par common/doc_store/index_settings.py à chaque
  # création d'index ; vide = valeur upstream de conf/mapping.json.
  {{- with .Values.elasticsearch.indexShards }}
  ES_NUMBER_OF_SHARDS: {{ . | quote }}
  {{- end }}
  {{- with .Values.elasticsearch.indexReplicas }}
  ES_NUMBER_OF_REPLICAS: {{ . | quote }}
  {{- end }}
{{- end }}

  # --- service_conf.yaml template ------------------------------------------
  # RAGFlow's Python config does NOT read MYSQL_HOST/REDIS_HOST/etc. env vars
  # — it reads conf/service_conf.yaml (hardcoded `localhost` defaults) plus
  # an optional conf/local.service_conf.yaml overlay. We render that overlay
  # from this template via envsubst in an initContainer (see deployment.yaml
  # of api + task-executor sub-charts).
  service_conf.yaml.template: |
    ragflow:
      host: 0.0.0.0
      http_port: 9380
    admin:
      host: 0.0.0.0
      http_port: 9381
    mysql:
      name: ragflow
      user: ragflow
      password: ${MYSQL_PASSWORD}
      host: {{ .Release.Name }}-mariadb.{{ .Release.Namespace }}.svc.cluster.local
      port: 3306
      max_connections: 900
      stale_timeout: 300
      max_allowed_packet: 1073741824
    minio:
      user: ${MINIO_USER}
      password: ${MINIO_PASSWORD}
      host: ${MINIO_HOST}
      bucket: ragflow-storage
      prefix_path: ''
    smtp:
      # « Mot de passe oublié » RAGFlow (OTP par email). Alimenté par le
      # MÊME secret que le mailer du panel (ragflow-mgmt-smtp) via envsubst
      # dans l'init-container api. Secret absent → variables vides →
      # mail_server vide → envoi refusé proprement côté api. Ajouter au
      # secret existant : ADMIN_SMTP_FROM_EMAIL=no-reply@cyllene.com
      # (sinon repli sur le compte SMTP comme expéditeur).
      mail_server: '${ADMIN_SMTP_HOST}'
      mail_port: ${ADMIN_SMTP_PORT}
      mail_use_ssl: false
      mail_use_tls: true
      mail_username: '${ADMIN_SMTP_USERNAME}'
      mail_password: '${ADMIN_SMTP_PASSWORD}'
      mail_default_sender:
        - 'Cyllene'
        - '${ADMIN_SMTP_FROM_EMAIL}'
      mail_frontend_url: '{{ .Values.global.scheme | default "https" }}://{{ .Values.global.hostname }}'
    redis:
      # Format expected by rag/utils/redis_conn.py: "host:port" in a single
      # string. Splitting on `:` gives the parts; setting host without port
      # makes `.split(":")[1]` IndexError → REDIS stays None silently.
      host: {{ .Release.Name }}-redis.{{ .Release.Namespace }}.svc.cluster.local:6379
      password: ${REDIS_PASSWORD}
      db: 1
    infinity:
      uri: {{ .Release.Name }}-infinity.{{ .Release.Namespace }}.svc.cluster.local:23817
      postgres_port: 5432
      db_name: default_db
    es:
      # Section inerte quand DOC_ENGINE=infinity (symétrique de la section
      # infinity quand DOC_ENGINE=elasticsearch). ELASTIC_PASSWORD vient du
      # ConfigMap (voir plus haut) — pas un secret critique : service
      # intra-namespace, même modèle que le compose upstream.
      hosts: 'http://{{ .Release.Name }}-es01.{{ .Release.Namespace }}.svc.cluster.local:9200'
      username: 'elastic'
      password: ${ELASTIC_PASSWORD}
