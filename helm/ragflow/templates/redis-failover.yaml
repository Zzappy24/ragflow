{{- if .Values.redis.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-redis-tuning
  labels:
    {{- include "ragflow.labels" . | nindent 4 }}
data:
  redis-additional.conf: |
    maxmemory-policy noeviction
    appendonly yes
    appendfsync everysec
    save 300 100
---
apiVersion: redis.redis.opstreelabs.in/v1beta2
kind: RedisReplication
metadata:
  name: {{ .Release.Name }}-redis
  labels:
    {{- include "ragflow.labels" . | nindent 4 }}
spec:
  clusterSize: {{ add .Values.redis.masterReplicas .Values.redis.slaveReplicas }}

  podSecurityContext:
    runAsUser: 0
    runAsGroup: 0
    fsGroup: 0

  securityContext:
    runAsUser: 0
    runAsGroup: 0
    runAsNonRoot: false

  redisExporter:
    enabled: true
    image: quay.io/opstree/redis-exporter:v1.44.0

  redisConfig:
    additionalRedisConfig: {{ .Release.Name }}-redis-tuning

  kubernetesConfig:
    image: quay.io/opstree/redis:v8.6.2
    imagePullPolicy: IfNotPresent
    redisSecret:
      name: {{ .Values.redis.authSecretRef }}
      key: REDIS_PASSWORD
    resources:
      {{- toYaml .Values.redis.resources | nindent 6 }}

  storage:
    volumeClaimTemplate:
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: {{ .Values.global.storageClass | quote }}
        resources:
          requests:
            storage: {{ .Values.redis.storage }}

{{- if gt (int .Values.redis.sentinelReplicas) 0 }}
---
apiVersion: redis.redis.opstreelabs.in/v1beta2
kind: RedisSentinel
metadata:
  name: {{ .Release.Name }}-redis-sentinel
  labels:
    {{- include "ragflow.labels" . | nindent 4 }}
spec:
  clusterSize: {{ .Values.redis.sentinelReplicas }}
  redisSentinelConfig:
    redisReplicationName: {{ .Release.Name }}-redis
    quorum: "2"
    parallelSyncs: "1"
    failoverTimeout: "30000"
    downAfterMilliseconds: "10000"
  kubernetesConfig:
    image: quay.io/opstree/redis-sentinel:v7.4.0
    imagePullPolicy: IfNotPresent
    redisSecret:
      name: {{ .Values.redis.authSecretRef }}
      key: REDIS_PASSWORD
    resources:
      requests: { cpu: 100m, memory: 128Mi }
      limits:   { cpu: 500m, memory: 256Mi }
{{- end }}
{{- end }}