# Infinity server config — mirrors docker/infinity_conf.toml (the compose
# path mounts it the same way with `-f /infinity_conf.toml`). Before this
# ConfigMap existed the K8s pod ran on IMAGE DEFAULTS, notably
# connection_pool_size=128: client pods that crashloop leave zombie thrift
# sessions behind (Infinity never reaps them — upstream issue
# infiniflow/infinity#3418) and the cap eventually fills up →
# TOO_MANY_CONNECTIONS (5003) on every insert until an Infinity restart
# (incident prod 2026-08-20). The raised default buys headroom between
# restarts; the real fix is upstream session reaping.
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-infinity-conf
  labels:
    {{- include "ragflow.labels" . | nindent 4 }}
data:
  infinity_conf.toml: |
    [general]
    version                  = "0.7.0"
    time_zone                = "utc-8"

    [network]
    server_address           = "0.0.0.0"
    postgres_port            = 5432
    http_port                = 23820
    client_port              = 23817
    connection_pool_size     = {{ .Values.infinity.connectionPoolSize | default 512 }}

    [log]
    log_filename             = "infinity.log"
    log_dir                  = "/var/infinity/log"
    log_to_stdout            = true
    log_file_max_size        = "100MB"
    log_file_rotate_count    = 10
    log_level                = "info"

    [storage]
    persistence_dir         = "/var/infinity/persistence"
    data_dir                = "/var/infinity/data"
    # Défauts amont : optimize 10s / cleanup 60s / compact 120s — un balayage
    # de TOUTES les tables toutes les 10 s, en contention OCC permanente avec
    # les inserts. Sous ingestion massive les écritures dépassent le timeout
    # RPC client, les replays s'empilent, plus rien ne committe (ts figé,
    # incident 2026-08-20 ~09:00 UTC). Intervalles détendus = le fond de
    # tâche passe entre les rafales d'écriture au lieu de les percuter.
    optimize_interval        = {{ .Values.infinity.optimizeInterval | default "60s" | quote }}
    cleanup_interval         = "120s"
    compact_interval         = {{ .Values.infinity.compactInterval | default "300s" | quote }}
    storage_type             = "local"
    mem_index_capacity       = 65536

    [buffer]
    buffer_manager_size      = {{ .Values.infinity.bufferManagerSize | default "8GB" | quote }}
    lru_num                  = 7
    temp_dir                 = "/var/infinity/tmp"
    result_cache             = "off"
    memindex_memory_quota    = "1GB"

    [wal]
    wal_dir                       = "/var/infinity/wal"

    [resource]
