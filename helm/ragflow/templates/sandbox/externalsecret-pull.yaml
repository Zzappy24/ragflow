{{- if and .Values.sandbox.enabled .Values.externalSecrets.enabled }}
# Harbor pull secret replicated into the sandbox namespace: the ephemeral
# sandbox Jobs pull the sandbox image from the same private Harbor as the
# platform. Same Vault source as templates/externalsecrets.yaml §5 — the
# ClusterSecretStore allows cross-namespace targets, so no manual
# `kubectl get secret ... | kubectl apply -n rag-sandbox` copy is needed
# and Vault rotations propagate automatically.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: harbor-pull-secret
  namespace: {{ .Values.sandbox.namespace.name | quote }}
  labels:
    {{- include "ragflow.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ .Values.externalSecrets.refreshInterval }}
  secretStoreRef:
    name: {{ .Values.externalSecrets.clusterSecretStore }}
    kind: ClusterSecretStore
  target:
    name: harbor-pull-secret
    creationPolicy: Owner
    template:
      type: kubernetes.io/dockerconfigjson
      data:
        .dockerconfigjson: "{{ "{{ .dockerconfigjson }}" }}"
  data:
    - secretKey: dockerconfigjson
      remoteRef:
        key: {{ .Values.externalSecrets.vaultPathPrefix }}/harbor-pull
        property: .dockerconfigjson
{{- end }}
