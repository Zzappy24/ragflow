{{- if .Values.externalSecrets.enabled }}
# ExternalSecrets — sourced from Vault via External Secrets Operator. The
# ESO controller syncs Vault → K8s Secret on a refreshInterval (default 1h).
# We never store secrets in this Git repo.
#
# Vault layout assumed (KV v2):
#   secret/data/ragflow/cyllene-prod/
#     ├── app
#     │     ADMIN_JWT_SECRET, RSA_PRIVATE_KEY, RSA_PASSPHRASE,
#     │     MYSQL_PASSWORD, REDIS_PASSWORD, MINIO_USER, MINIO_PASSWORD
#     ├── mariadb-root          (key: password)
#     ├── mariadb-app           (key: password)
#     ├── redis-auth            (key: REDIS_PASSWORD)
#     ├── minio-root            (keys: accesskey, secretkey)
#     └── harbor-pull           (keys: .dockerconfigjson)
#
# Operator install: external-secrets/external-secrets (cluster-wide).
# ClusterSecretStore `vault-cyllene` is provisioned separately by the
# infra team and references the cluster's Vault token / approle.

# ============================================================================
# 1. App-level secrets — consumed by ragflow-api + ragflow-task-executor.
# ============================================================================
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ragflow-app-secrets
  labels:
    {{- include "ragflow.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ .Values.externalSecrets.refreshInterval }}
  secretStoreRef:
    name: {{ .Values.externalSecrets.clusterSecretStore }}
    kind: ClusterSecretStore
  target:
    name: ragflow-app-secrets
    creationPolicy: Owner
  data:
    # JWT signing key — used by api/utils to sign session tokens.
    - secretKey: ADMIN_JWT_SECRET
      remoteRef:
        key: {{ .Values.externalSecrets.vaultPathPrefix }}/app
        property: ADMIN_JWT_SECRET
    # RSA passphrase + private key — used by quart-auth for the cookie.
    - secretKey: RSA_PASSPHRASE
      remoteRef:
        key: {{ .Values.externalSecrets.vaultPathPrefix }}/app
        property: RSA_PASSPHRASE
    - secretKey: RSA_PRIVATE_KEY
      remoteRef:
        key: {{ .Values.externalSecrets.vaultPathPrefix }}/app
        property: RSA_PRIVATE_KEY
    # MariaDB app password (matches MARIADB CR's databaseSecretRef value).
    - secretKey: MYSQL_PASSWORD
      remoteRef:
        key: {{ .Values.externalSecrets.vaultPathPrefix }}/mariadb-app
        property: password
    # Redis password (matches RedisReplication's redisSecret value).
    - secretKey: REDIS_PASSWORD
      remoteRef:
        key: {{ .Values.externalSecrets.vaultPathPrefix }}/redis-auth
        property: REDIS_PASSWORD
    # MinIO access key + secret — used by ragflow-api as the MinIO client.
    - secretKey: MINIO_USER
      remoteRef:
        key: {{ .Values.externalSecrets.vaultPathPrefix }}/minio-root
        property: accesskey
    - secretKey: MINIO_PASSWORD
      remoteRef:
        key: {{ .Values.externalSecrets.vaultPathPrefix }}/minio-root
        property: secretkey

---
# ============================================================================
# 2. MariaDB operator — root password + app user password (separate Secrets
# because the operator's CR demands two distinct refs).
# ============================================================================
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ .Values.mariadb.rootPasswordSecretRef }}
  labels:
    {{- include "ragflow.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ .Values.externalSecrets.refreshInterval }}
  secretStoreRef:
    name: {{ .Values.externalSecrets.clusterSecretStore }}
    kind: ClusterSecretStore
  target:
    name: {{ .Values.mariadb.rootPasswordSecretRef }}
    creationPolicy: Owner
  data:
    - secretKey: password
      remoteRef:
        key: {{ .Values.externalSecrets.vaultPathPrefix }}/mariadb-root
        property: password

---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ .Values.mariadb.databaseSecretRef }}
  labels:
    {{- include "ragflow.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ .Values.externalSecrets.refreshInterval }}
  secretStoreRef:
    name: {{ .Values.externalSecrets.clusterSecretStore }}
    kind: ClusterSecretStore
  target:
    name: {{ .Values.mariadb.databaseSecretRef }}
    creationPolicy: Owner
  data:
    - secretKey: password
      remoteRef:
        key: {{ .Values.externalSecrets.vaultPathPrefix }}/mariadb-app
        property: password

---
# ============================================================================
# 3. Redis operator — secret with key `REDIS_PASSWORD`. Shared between the
# RedisReplication (workload) and the KEDA TriggerAuthentication (auth for
# the Redis scaler).
# ============================================================================
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ .Values.redis.authSecretRef }}
  labels:
    {{- include "ragflow.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ .Values.externalSecrets.refreshInterval }}
  secretStoreRef:
    name: {{ .Values.externalSecrets.clusterSecretStore }}
    kind: ClusterSecretStore
  target:
    name: {{ .Values.redis.authSecretRef }}
    creationPolicy: Owner
  data:
    - secretKey: REDIS_PASSWORD
      remoteRef:
        key: {{ .Values.externalSecrets.vaultPathPrefix }}/redis-auth
        property: REDIS_PASSWORD

---
# ============================================================================
# 4. MinIO operator — Tenant configuration secret. Format is documented at
# https://min.io/docs/minio/kubernetes/upstream/reference/operator-environment-variables.html
# At minimum we need MINIO_ROOT_USER + MINIO_ROOT_PASSWORD.
# ============================================================================
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ .Values.minio.rootCredentialsSecretRef }}
  labels:
    {{- include "ragflow.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ .Values.externalSecrets.refreshInterval }}
  secretStoreRef:
    name: {{ .Values.externalSecrets.clusterSecretStore }}
    kind: ClusterSecretStore
  target:
    name: {{ .Values.minio.rootCredentialsSecretRef }}
    creationPolicy: Owner
    template:
      type: Opaque
      data:
        # The operator looks for these literal env-var names inside the
        # Secret. We synthesize them from accesskey/secretkey in Vault.
        config.env: |
          export MINIO_ROOT_USER="{{ "{{ .accesskey }}" }}"
          export MINIO_ROOT_PASSWORD="{{ "{{ .secretkey }}" }}"
  data:
    - secretKey: accesskey
      remoteRef:
        key: {{ .Values.externalSecrets.vaultPathPrefix }}/minio-root
        property: accesskey
    - secretKey: secretkey
      remoteRef:
        key: {{ .Values.externalSecrets.vaultPathPrefix }}/minio-root
        property: secretkey

---
# ============================================================================
# 5. Harbor pull secret — kubelet uses this to authenticate when pulling
# the ragflow image from the internal Harbor.
# ============================================================================
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: harbor-pull-secret
  labels:
    {{- include "ragflow.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ .Values.externalSecrets.refreshInterval }}
  secretStoreRef:
    name: {{ .Values.externalSecrets.clusterSecretStore }}
    kind: ClusterSecretStore
  target:
    name: harbor-pull-secret
    creationPolicy: Owner
    template:
      type: kubernetes.io/dockerconfigjson
      data:
        .dockerconfigjson: "{{ "{{ .dockerconfigjson }}" }}"
  data:
    - secretKey: dockerconfigjson
      remoteRef:
        key: {{ .Values.externalSecrets.vaultPathPrefix }}/harbor-pull
        property: .dockerconfigjson
{{- end }}
