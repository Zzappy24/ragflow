# =============================================================================
#  Cyllene production overrides — alterai-prod cluster (RKE2 + odiso.net)
# -----------------------------------------------------------------------------
#  This file holds ONLY the deltas vs values.yaml. Read both together.
# =============================================================================

global:
  imageRegistry: "harbor.cylndata.cyllene.pro"
  imageRepository: "data/ragflow"
  imageTag: "v0.1"
  hostname: "ragflow.cyllene.cloud"
  imagePullSecrets:
    - name: harbor-pull-secret

externalSecrets:
  enabled: false

# Phase 0 sizing — Bodemer launch (≤ 200 simultaneous users).
# When we add the 2nd customer, bump these in values-cyllene-prod.yaml only.
ragflow-api:
  replicas: 2
  hpa:
    minReplicas: 2
    maxReplicas: 4
  affinity:
    nodeAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        nodeSelectorTerms:
          - matchExpressions:
              - key: node-role.kubernetes.io/gpt
                operator: In
                values:
                  - "true"
  tolerations:
    - key: node-role
      operator: Equal
      value: gpu
      effect: NoSchedule


ragflow-task-executor:
  replicas: 2
  keda:
    minReplicas: 2
    maxReplicas: 8              # raise to 20 in Phase 2

mariadb:
  storage: "50Gi"               # ~10× the upstream POC for audit trail headroom
  replicas: 2                   # Galera HA from day 1 — 1 client × downtime is bad

redis:
  storage: "10Gi"

minio:
  servers: 2
  volumesPerServer: 2
  size: "200Gi"                 # 800 GiB raw, ~600 GiB usable post EC

infinity:
  storage: "100Gi"

# vLLM is shared with the rest of the platform (ns `vllm-rag`); these URLs
# are the agreed contract with the AI infra team. Confirm before flipping
# values-cyllene-prod live.

monitoring:
  serviceMonitor:
    namespace: "monitoring"     # the cluster's existing prom-operator ns

networkPolicy:
  enabled: false