# =============================================================================
#  Cyllene production overrides — alterai-prod cluster (RKE2 + odiso.net)
# -----------------------------------------------------------------------------
#  This file holds ONLY the deltas vs values.yaml. Read both together.
# =============================================================================

global:
  imageRegistry: "harbor.cylndata.cyllene.pro"
  imageRepository: "data/ragflow"
  imageTag: "v0.9.17.10"
  hostname: "ragflow.cyllene.cloud"
  # HTTPS actif depuis 2026-07-13 : listeners 443 sur le Gateway partagé
  # (envoy-gateway-system), certs Let's Encrypt via cert-manager gateway-shim.
  # Ce scheme pilote les liens d'invitation, le CORS et l'URL publique du panel.
  scheme: "https"
  # Listener 443 du Gateway partagé pour ragflow.cyllene.cloud (redirect 80->443 auto)
  httpsListenerName: "https-ragflow"
  imagePullSecrets:
    - name: harbor-pull-secret
  env:
    INTERNAL_API_SECRET: "bb147273319ee168e9825b94842ad048ba9d8e569164c4cbd90b0dfd97ffef06"
    # ── BENCH ES 9.5.2 (2026-08-28, memory project_engine_strategy) ─────────
    # Bascule EN PLACE : la référence Infinity est déjà mesurée (CRAG), pas
    # besoin des deux moteurs simultanément. Les KB existantes (Infinity)
    # sont INVISIBLES tant que ce flag est sur elasticsearch — données
    # intactes, retour = revert de ce bloc + sync (supprimer d'abord les KB
    # créées sous ES). Si ES gagne le bench, cette bascule EST la migration.
    # Requiert l'image ≥ v0.9.15 (fix exclude_source_vectors, ragflow#13272).
    DOC_ENGINE: "elasticsearch"
  # k8s sandbox provider is enabled below — task-executor needs its SA
  # token in-cluster to create/watch/delete sandbox Jobs.
  sandboxTokenAutomount: true
externalSecrets:
  enabled: false

 # Envoy Gateway is the cluster ingress controller. Templates render
  # `Gateway` + `HTTPRoute` resources rather than legacy `Ingress`.
  gatewayClassName: "envoy"
  # Gateway resource the HTTPRoutes attach to. Created cluster-wide once.
  gatewayName: "envoy-gateway"
  gatewayNamespace: "envoy-gateway-system"

# Reduced bootstrap sizing for constrained cluster capacity.
ragflow-api:
  # 4 replicas × 1 hypercorn worker (bump 2→4, 2026-08-27). On garde la
  # philosophie 1 worker = 1 pod (visibilité kubectl, pas de lock inter-
  # workers, ressources prévisibles) mais 2 workers étaient trop peu :
  # starvation observée pendant l'ingestion CRAG — les appels qui touchent
  # Infinity (POST/DELETE /chunks, /retrieval) bloquent un worker (peewee/
  # Infinity synchrones) et sous charge de parsing les 2 workers se
  # bloquaient, gelant tout listing 30-40s (DB propre, CPU idle prouvés).
  # IMPORTANT : le HPA scale sur CPU/mémoire — il est AVEUGLE à cette
  # starvation I/O (CPU idle pendant le hang) et ne montera jamais seul :
  # le plancher minReplicas EST la capacité réelle. RAM ~1,3 Gi/pod, le
  # node GPU a 200+ Gi libres.
  # Plancher 4 -> 6 après l'incident starvation 2026-09-05 : le HPA restant
  # aveugle à la starvation I/O (CPU idle pendant le hang), minReplicas EST
  # la capacité réelle. 6 event loops tolèrent la rafale de listings/graph
  # d'un utilisateur sur un gros dataset avant blocage total. Le vrai fix
  # racine reste l'offload des appels bloquants (audit /graph + listings).
  replicas: 6
  hpa:
    minReplicas: 6
    maxReplicas: 8
  # Incident starvation 2026-09-05 : log WARNING toute requête API > 2 s
  # (hook dans api/apps/__init__.py, donc côté API uniquement — pas
  # task-executor). Les listings/graph lents deviennent visibles dans les
  # logs (grep "SLOW"). NB : ne capture QUE les requêtes qui aboutissent ;
  # un hang total (client reset) ne se termine jamais et n'apparaît pas.
  extraEnv:
    - name: SLOW_REQUEST_LOG_MS
      value: "2000"
    # Pool Peewee par pod api : 16 (configmap) -> 32. Depuis l'offload des
    # vues sync en threads (THREAD_POOL_MAX_WORKERS=128), jusqu'à 128 threads
    # peuvent vouloir une connexion en même temps ; à 16, une rafale de
    # listings attend DB_POOL_TIMEOUT (10 s) puis part en 500. Les
    # connexions ne s'ouvrent qu'à la demande (stale_timeout 300 s les
    # referme) : c'est un plafond, pas un régime. Budget sous
    # mariadb.maxUserConnections=400 (ci-dessous) : 8 pods api × 32 = 256
    # + 3 executors × 16 = 48 + mgmt ≈ 320. Si maxReplicas monte, recalculer.
    - name: DB_POOL_SIZE
      value: "32"
  # On garde l'API sur le node GPU (alteraiworkergpt1) — les CPU workers
  # (alteraiworker1/2/3) sont saturés (98%, 153% mem requests). Le node
  # GPU a 200+ Gi RAM libre (vLLM utilise les GPU, pas la CPU/RAM).
  # Le hang d'init "huqie.txt → silence" qu'on a vu 2026-06-29 venait
  # d'Infinity dégradé (gRPC unresponsive), pas du node — cf le fix
  # timeout dans common/doc_store/infinity_conn_pool.py.
  affinity:
    nodeAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        nodeSelectorTerms:
          - matchExpressions:
              - key: node-role.kubernetes.io/gpt
                operator: In
                values:
                  - "true"
  # CPU limits bumped 1 → 4 after observing 57.9% throttling on prod
  # 2026-06-30 (nr_throttled=3429/5920 periods, ~20h cumulative throttle).
  # The node alteraiworkergpt1 has 220 cores at 6% allocated — plenty of
  # headroom. requests stay at 1 (real reservation), limits=4 lets the
  # async event loop burst when needed (without throttling stalls that
  # made /healthz timeout and triggered kubelet SIGKILL).
  resources:
    requests:
      cpu: "1"
      memory: "4Gi"
    limits:
      cpu: "4"
      memory: "8Gi"

  # Timeouts probes bumpés 5s → 10s pour tolérer les micro-blocages de
  # l'event loop async (Quart) sous charge. Le default K8s de 1s est
  # trop tight, 5s l'était encore parfois pour du burst. Le budget global
  # (failureThreshold × periodSeconds) reste inchangé, on ne réduit pas
  # la sensibilité au crash — juste on tolère les glitches transitoires.
  probes:
    startup:
      timeoutSeconds: 10
    liveness:
      timeoutSeconds: 10
    readiness:
      timeoutSeconds: 10

  tolerations:
    - key: node-role
      operator: Equal
      value: gpu
      effect: NoSchedule
    - key: nvidia.com/gpu
      operator: Exists
      effect: NoSchedule

ragflow-task-executor:
  enabled: true
  # 3 pods × WORKER_MAX_TASKS=4 = 12 tasks parallèles. Avec MIG mixed
  # (2 Qwen + 4 bge-m3 + 1 reranker + 3 task-executor = 10/10 slots
  # utilisés sur 2 GPUs full + 8 MIG dispos), pas de marge mais c'est
  # le throughput max possible pour Cyllene (cluster dédié à ce projet).
  replicas: 3
  # Tells DeepDoc / pip_install_torch to install torch and use the
  # CUDAExecutionProvider in onnxruntime. Without it, onnxruntime falls
  # back to CPU even when the pod has nvidia.com/gpu allocated.
  device: "gpu"
  # 4 tasks parallèles par pod. Possible parce qu'on bump
  # OCR_GPU_MEM_LIMIT_MB à 8192 (8 GB par session ONNX, arena BFC).
  # Footprint max théorique = 4 tasks × 4 sessions × 8 GB = 128 GB cap,
  # mais en pratique ~10-20 GB réel (arenas grossissent à la demande).
  # Tient large dans un slot 24 GB time-slicing (4 GPUs × 4 replicas).
  workerMaxTasks: "4"
  # Bumpe le cap arena BFC par session ONNX de 2 GB (default DeepDoc)
  # à 8 GB. C'est le fix au problème "Available memory of 1048576 is
  # smaller than requested bytes of N" qu'on voyait sur les PDFs un
  # peu lourds. C'est un PLAFOND, pas une réservation — les arenas
  # grossissent power-of-two à la demande.
  # 8192 → 5120 (2026-09-01) : sous OCR soutenu (PDF Zabbix 2300 pages,
  # 4 tâches parallèles), 4 sessions ONNX × 8 Go de plafond = 32 Go
  # potentiels sur un slot MIG de 24 Go → GPU plein, l'arène ne peut plus
  # s'étendre ("Available memory of 1048576 is smaller than requested"),
  # tâches de pages en échec. 4 × 5 Go = 20 Go ≤ 24 Go : chaque session
  # garde un plafond garanti au lieu de s'affamer mutuellement.
  ocrGpuMemLimitMb: "5120"
  # MIG mixed strategy active depuis 2026-07-01 — GPUs 2,3 splittés en
  # 4 instances de 24 GB chacun (8 instances MIG total). Le task-executor
  # demande une instance MIG (`nvidia.com/mig-1g.24gb: 1`) au lieu d'un
  # GPU full (`nvidia.com/gpu: 1` = un des 2 GPUs réservés à Qwen).
  # 24 GB suffit largement pour DeepDoc ONNX (~2 GB cumulé pour les 4
  # modèles det/rec/layout/tsr avec OCR_GPU_MEM_LIMIT_MB=8192).
  resources:
    requests:
      cpu: "1000m"
      memory: "4Gi"
      nvidia.com/mig-1g.24gb: 1
    limits:
      cpu: "4000m"
      memory: "16Gi"
      nvidia.com/mig-1g.24gb: 1
  affinity:
    nodeAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        nodeSelectorTerms:
          - matchExpressions:
              - key: node-role.kubernetes.io/gpt
                operator: In
                values: ["true"]
  tolerations:
    - key: nvidia.com/gpu
      operator: Exists
      effect: NoSchedule
  # Incident 2026-08-07 : 3 workers figés 3 jours (event-loop bloquée sur
  # des appels LLM pendants — GraphRAG/RAPTOR vers un backend Qwen muet),
  # pods "Running" mais 0 consommation, toute la file en pending. Deux
  # correctifs config, AUCUN code touché :
  #
  # 1. Liveness probe sur le heartbeat que le worker écrit déjà toutes
  #    les 30 s (rag/svr/_k8s_runtime.py). Le mécanisme existait, jamais
  #    activé en prod. maxAge 180 s = large marge vs les 30 s nominales
  #    (les tâches OCR lourdes n'ont jamais bloqué le heartbeat — vérifié
  #    sur un parse de 271 s le 2026-08-10) ; un worker gelé est recyclé
  #    en ~4-5 min au lieu de rester zombie des jours.
  livenessProbe:
    enabled: true
    heartbeatFile: "/tmp/k8s_heartbeat"
    maxAgeSeconds: 180
    initialDelaySeconds: 120      # laisse l'init (modèles, Infinity) finir
    periodSeconds: 30
    # 3 échecs (et pas 2) + timeout 10 s : le default K8s timeoutSeconds=1
    # faisait "timer out" l'exec probe pendant les chargements ONNX/GPU →
    # worker sain tué en pleine tâche (observé 2026-08-10, event "command
    # timed out after 1s"). Même leçon que les probes API (timeoutSeconds
    # bumpé pour tolérer les micro-blocages sous charge).
    failureThreshold: 3
    timeoutSeconds: 10
  # 2. Timeouts LLM adaptés à l'ingestion. Défauts upstream (600 s × 6
  #    tentatives ≈ 1 h par appel face à un backend muet) × dizaines
  #    d'appels GraphRAG par doc = gel de fait. 120 s × 3 tentatives
  #    ≈ 7 min max par appel : la tâche échoue proprement et libère son
  #    slot au lieu de figer le worker. Ne concerne QUE les workers —
  #    l'API server garde les défauts (chat interactif streamé).
  extraEnv:
    - name: LLM_TIMEOUT_SECONDS
      value: "120"
    - name: LLM_MAX_RETRIES
      value: "2"
  # Node alteraiworkergpt1: 4x RTX PRO 6000 Blackwell (96 GB each).
  # MIG mixed strategy active depuis 2026-07-01 → 2 GPUs full (Qwen×2)
  # + 8 instances MIG (1g.24gb). Slots utilisés en fonctionnement normal:
  # - 4 bge-m3 (embedding)
  # - 1 bge-reranker
  # - 3 task-executor (max)
  # = 8 slots MIG utilisés / 8 dispos. 0 marge, throughput max.
  #
  # KEDA: on garde ScaledObject actif pour le pattern "backlog-aware"
  # (si le user upload 100 docs, KEDA les traite pas plus vite qu'à
  # capacité, mais au moins il utilise à fond les 3 slots). En idle,
  # KEDA voudrait descendre à 1 pour libérer 2 slots MIG, mais comme
  # les autres workloads (bge-m3, reranker, Qwen) sont pinés à des
  # replicas fixes, ces slots resteraient vides = gâchés. Donc on
  # force minReplicas = maxReplicas = 3 pour saturer les 3 slots réservés.
  keda:
    minReplicas: 3
    maxReplicas: 3

mariadb:
  # Plafond par utilisateur SQL 'ragflow' (User CR, ALTER USER reconcilié) :
  # 300 -> 400 pour absorber DB_POOL_SIZE=32 côté api (budget ≈ 320, cf.
  # ragflow-api.extraEnv). Reste < max_connections=500 du serveur pour que
  # root et l'exporter gardent leurs slots.
  maxUserConnections: 400
  enabled: true
  storage: "50Gi"
  replicas: 1
  galera: false
  metrics: false
  rootPasswordSecretRef: "ragflow-mariadb-root"
  databaseSecretRef: "ragflow-mariadb-app"
  resources:
    requests:
      cpu: "250m"
      memory: "256Mi"
    limits:
      cpu: "1000m"
      memory: "1Gi"

redis:
  enabled: true
  storage: "10Gi"
  masterReplicas: 1
  slaveReplicas: 0
  sentinelReplicas: 0
  authSecretRef: "ragflow-redis-auth"
  resources:
    requests:
      cpu: "50m"
      memory: "128Mi"
    limits:
      cpu: "500m"
      memory: "512Mi"

minio:
  enabled: true
  host: "minio-hl.rag-new2.svc.cluster.local:9000"
  servers: 1
  volumesPerServer: 1
  size: "200Gi"
  rootCredentialsSecretRef: "ragflow-minio-root"
  resources:
    requests:
      cpu: "100m"
      memory: "256Mi"
    limits:
      cpu: "1000m"
      memory: "1Gi"

# ── BENCH ES : StatefulSet ES 9.5.2 à côté d'Infinity (même node GPU) ───────
# Infinity reste up (données préservées, retour arrière instantané) mais
# n'est plus utilisé tant que DOC_ENGINE=elasticsearch.
elasticsearch:
  enabled: true
  version: "9.5.2"
  storage: "100Gi"
  javaOpts: "-Xms8g -Xmx8g"
  resources:
    requests: { cpu: "1000m", memory: "12Gi" }
    limits:   { cpu: "4000m", memory: "24Gi" }   # miroir des limits Infinity
  nodeSelector:
    node-role.kubernetes.io/gpt: "true"
  tolerations:
    - key: node-role
      operator: Equal
      value: gpu
      effect: NoSchedule
    - key: nvidia.com/gpu
      operator: Exists
      effect: NoSchedule

infinity:
  # x64-v3 (AVX2) : confirmé sur le nœud Infinity le 2026-08-26
  # (grep -c avx2 /proc/cpuinfo = 220). Fallback si reschedule sur un
  # nœud plus ancien : v0.7.3-x64-v2.
  image: "infiniflow/infinity:v0.7.3-x64-v3"
  storage: "100Gi"
  # Mode fenêtre de maintenance : quasi plus de maintenance périodique en
  # journée (elle percute les écritures en txn OCC — incidents 2026-08-19/20,
  # infiniflow/infinity#3418) ; le CronJob de 01:00 fait optimize+compact
  # sur toutes les tables. Après un gros run d'ingestion :
  #   kubectl -n rag-new2 create job --from=cronjob/rag-new2-infinity-maintenance manual-$(date +%s)
  optimizeInterval: "24h"
  compactInterval: "24h"
  maintenance:
    enabled: true
  # Incident 2026-08-10 : OOMKilled (35 restarts cumulés !) pendant un
  # re-parse de 14 docs — tempête de conflits delete-vs-delete sur la même
  # table (12 tâches parallèles × retries) → CPU 195%, mémoire > 8Gi → kill.
  # L'ancien sizing bootstrap (8Gi) écrasait même le défaut du chart (16Gi).
  #
  # DÉPLACÉ sur le node GPU (alteraiworkergpt1, ~450Gi dont ~350Gi libres,
  # vérifié kubectl describe node 2026-08-10) : l'ancien hôte alteraiworker1
  # ne fait que ~16Gi allocatable — un plafond 24Gi y était infaisable
  # (OOM node). Bonus : co-localisé avec api + task-executors (trafic
  # thrift local). Le PVC rook-ceph-block (RWO) se ré-attache au nouveau
  # node au reschedule.
  resources:
    requests:
      cpu: "1000m"
      memory: "4Gi"
    limits:
      cpu: "4000m"
      memory: "24Gi"
  affinity:
    nodeAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        nodeSelectorTerms:
          - matchExpressions:
              - key: node-role.kubernetes.io/gpt
                operator: In
                values: ["true"]
  tolerations:
    - key: node-role
      operator: Equal
      value: gpu
      effect: NoSchedule
    - key: nvidia.com/gpu
      operator: Exists
      effect: NoSchedule

monitoring:
  serviceMonitor:
    namespace: "monitoring"

networkPolicy:
  enabled: false

# k8s sandbox provider — CodeExec tool runs as one-shot Jobs in their own
# namespace, isolated by RBAC + NetworkPolicy + ResourceQuota (see
# helm/ragflow/templates/sandbox/*.yaml).
sandbox:
  enabled: true
  image:
    repository: "harbor.cylndata.cyllene.pro/data/ragflow-sandbox-python"
    # Depuis la release v0.9.11 : tag aligné sur global.imageTag (une
    # release = un tag partout, l'utilisateur rebuilde toutes les images).
    # Le contenu sandbox n'a pas changé depuis v0.9.7 — rebuild d'uniformisation.
    tag: "v0.9.16.2"
  # harbor-pull-secret is copied once into rag-sandbox out-of-band
  # (externalSecrets disabled on this cluster) — this is only the NAME the
  # sandbox Jobs reference.
  imagePullSecret: "harbor-pull-secret"
  networkPolicy:
    minioNamespace: "rag-new2"
    # minio-operator labels tenant pods `v1.min.io/tenant: <tenant-name>`
    # (NOT `app: minio` — that's only the values.yaml generic placeholder).
    # Confirmed against this same chart's templates/minio-tenant.yaml
    # (Tenant CR `metadata.name: minio`) and the existing egress rule in
    # templates/networkpolicy.yaml ("4a. api -> ... MinIO" block), both of
    # which already select MinIO pods with `v1.min.io/tenant: minio`.
    # `app: null` un-sets the values.yaml default key — Helm deep-merges
    # nested maps across -f files, so without this both `app: minio` and
    # `v1.min.io/tenant: minio` would end up required together (matchLabels
    # is AND semantics) and the rule would never match any real pod.
    minioPodSelector:
      app: null
      v1.min.io/tenant: minio

ragflow-frontend:
  enabled: true
  # 2 replicas (bump 1→2, 2026-09-01) : le nginx front proxifie AUSSI tout
  # le trafic API (/api/, /v1/) — à 1 pod c'était un SPOF sur le chemin de
  # chaque requête, et le PDB minAvailable:1 bloquait les drains de nœud.
  replicas: 2
  resources:
    requests:
      cpu: "100m"
      memory: "128Mi"
    limits:
      cpu: "500m"
      memory: "512Mi"

vllm:
  chatBaseUrl: "http://vllm-router-service.vllm.svc.cluster.local/v1"
  embedBaseUrl: "http://vllm-router-service.vllm.svc.cluster.local/v1"
  rerankBaseUrl: "http://vllm-router-service.vllm.svc.cluster.local/v1"
  chatModel: "Qwen/Qwen3.6-27B-FP8"
  embedModel: "BAAI/bge-m3"                  # ← vrai embedding
  rerankModel: "BAAI/bge-reranker-v2-m3"     # ← vrai rerank
# CUSTOM B2B SaaS — produit Code (data plane LiteLLM, repo infra argo-helm/litellm-helm)
ragflow-management-frontend:
  httpsListenerName: "https-mgmt"

ragflow-management-backend:
  code:
    litellmBaseUrl: "http://litellm.litellm.svc.cluster.local:4000"
    housekeepingCronJob:
      enabled: true
    gatewayPublicUrl: "https://litellm.cyllene.cloud/v1"
