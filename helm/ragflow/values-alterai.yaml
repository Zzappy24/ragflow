# =============================================================================
#  Cyllene production overrides — alterai-prod cluster (RKE2 + odiso.net)
# -----------------------------------------------------------------------------
#  This file holds ONLY the deltas vs values.yaml. Read both together.
# =============================================================================

global:
  imageRegistry: "harbor.cylndata.cyllene.pro"
  imageRepository: "data/ragflow"
  imageTag: "v0.1"
  hostname: "ragflow.cyllene.cloud"
  imagePullSecrets:
    - name: harbor-pull-secret

externalSecrets:
  enabled: false

# Phase 0 sizing — Bodemer launch (≤ 200 simultaneous users).
# When we add the 2nd customer, bump these in values-cyllene-prod.yaml only.
ragflow-api:
  replicas: 2
  hpa:
    minReplicas: 2
    maxReplicas: 4
  affinity:
    nodeAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        nodeSelectorTerms:
          - matchExpressions:
              - key: node-role.kubernetes.io/gpt
                operator: In
                values:
                  - "true"
  tolerations:
    - key: node-role
      operator: Equal
      value: gpu
      effect: NoSchedule


ragflow-task-executor:
  replicas: 2
  keda:
    minReplicas: 2
    maxReplicas: 8              # raise to 20 in Phase 2

mariadb:
  enabled: true
  storage: "50Gi"
  replicas: 1
  galera: false
  metrics: false
  rootPasswordSecretRef: "ragflow-mariadb-root"
  databaseSecretRef: "ragflow-mariadb-app"
  resources:
    requests:
      cpu: "250m"
      memory: "512Mi"
    limits:
      cpu: "1000m"
      memory: "2Gi"

redis:
  enabled: true
  storage: "10Gi"
  masterReplicas: 1
  slaveReplicas: 0
  sentinelReplicas: 0
  authSecretRef: "ragflow-redis-auth"
  resources:
    requests:
      cpu: "100m"
      memory: "256Mi"
    limits:
      cpu: "500m"
      memory: "1Gi"

minio:
  enabled: true
  servers: 1
  volumesPerServer: 1
  size: "200Gi"
  rootCredentialsSecretRef: "ragflow-minio-root"
  resources:
    requests:
      cpu: "100m"
      memory: "256Mi"
    limits:
      cpu: "1000m"
      memory: "1Gi"

infinity:
  storage: "100Gi"

# vLLM is shared with the rest of the platform (ns `vllm-rag`); these URLs
# are the agreed contract with the AI infra team. Confirm before flipping
# values-cyllene-prod live.

monitoring:
  serviceMonitor:
    namespace: "monitoring"     # the cluster's existing prom-operator ns

networkPolicy:
  enabled: false