---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "ragflow.fullname" . }}
  labels:
    {{- include "ragflow.labels" . | nindent 4 }}
    app.kubernetes.io/component: ragflow
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "ragflow.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: ragflow
  {{- with .Values.ragflow.deployment.strategy }}
  strategy:
    {{- . | toYaml | nindent 4 }}
  {{- end }}
  template:
    metadata:
      labels:
        {{- include "ragflow.labels" . | nindent 8 }}
        app.kubernetes.io/component: ragflow
      annotations:
        checksum/values: {{ .Values | toYaml | sha256sum }}
        checksum/config-env: {{ include (print $.Template.BasePath "/env.yaml") . | sha256sum }}
        checksum/config-ragflow: {{ include (print $.Template.BasePath "/ragflow_config.yaml") . | sha256sum }}
    spec:
      {{- if or .Values.global.imagePullSecrets .Values.ragflow.image.pullSecrets }}
      imagePullSecrets:
        {{- with .Values.global.imagePullSecrets }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
        {{- with .Values.ragflow.image.pullSecrets }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- end }}
      containers:
      - name: ragflow
        image: {{ include "ragflow.imageRepo" (dict "root" . "repo" .Values.ragflow.image.repository) }}:{{ .Values.ragflow.image.tag }}
        {{- with .Values.ragflow.image.pullPolicy }}
        imagePullPolicy: {{ . }}
        {{- end }}
        {{- if or .Values.ragflow.admin.enabled .Values.ragflow.mcp.enabled }}
        args:
          {{- if .Values.ragflow.admin.enabled }}
          - "--enable-adminserver"
          {{- end }}
          {{- if .Values.ragflow.mcp.enabled }}
          - "--enable-mcpserver"
          - "--mcp-host=0.0.0.0"
          - "--mcp-port={{ .Values.ragflow.mcp.port }}"
          - "--mcp-base-url={{ .Values.ragflow.mcp.baseUrl }}"
          - "--mcp-mode={{ .Values.ragflow.mcp.mode }}"
          - "--mcp-script-path=/ragflow/mcp/server/server.py"
          {{- if eq .Values.ragflow.mcp.mode "self-host" }}
          - "--mcp-host-api-key=$(MCP_HOST_API_KEY)"
          {{- end }}
          {{- if not .Values.ragflow.mcp.transport.sse }}
          - "--no-transport-sse-enabled"
          {{- end }}
          {{- if not .Values.ragflow.mcp.transport.streamableHttp }}
          - "--no-transport-streamable-http-enabled"
          {{- end }}
          {{- if not .Values.ragflow.mcp.transport.jsonResponse }}
          - "--no-json-response"
          {{- end }}
          {{- end }}
        {{- end }}
        ports:
          - containerPort: 80
            name: http
          - containerPort: 9380
            name: http-api
          {{- if .Values.ragflow.admin.enabled }}
          - containerPort: 9381
            name: admin
          {{- end }}
          {{- if .Values.ragflow.mcp.enabled }}
          - containerPort: {{ .Values.ragflow.mcp.port }}
            name: mcp
          {{- end }}
        volumeMounts:
          - mountPath: /etc/nginx/conf.d/ragflow.conf.python
            subPath: ragflow.conf.python
            name: nginx-config-volume
          - mountPath: /etc/nginx/proxy.conf
            subPath: proxy.conf
            name: nginx-config-volume
          - mountPath: /etc/nginx/nginx.conf
            subPath: nginx.conf
            name: nginx-config-volume
          {{- with .Values.ragflow.service_conf }}
          - mountPath: /ragflow/conf/local.service_conf.yaml
            subPath: local.service_conf.yaml
            name: service-conf-volume
          {{- end }}
          {{- with .Values.ragflow.llm_factories }}
          - mountPath: /ragflow/conf/llm_factories.json
            subPath: llm_factories.json
            name: service-conf-volume
          {{- end }}
        envFrom:
          - secretRef:
              name: {{ include "ragflow.fullname" . }}-env-config
        {{- if and .Values.ragflow.mcp.enabled (eq .Values.ragflow.mcp.mode "self-host") }}
        env:
          - name: MCP_HOST_API_KEY
            {{- if .Values.ragflow.mcp.existingSecret }}
            valueFrom:
              secretKeyRef:
                name: {{ .Values.ragflow.mcp.existingSecret }}
                key: host-api-key
            {{- else }}
            valueFrom:
              secretKeyRef:
                name: {{ include "ragflow.fullname" . }}-mcp
                key: host-api-key
            {{- end }}
        {{- end }}
        {{- with .Values.ragflow.deployment.resources }}
        resources:
          {{- . | toYaml | nindent 10 }}
        {{- end }}
      volumes:
        - name: nginx-config-volume
          configMap:
            name: nginx-config
        - name: service-conf-volume
          configMap:
            name: ragflow-service-config
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "ragflow.fullname" . }}
  labels:
    {{- include "ragflow.labels" . | nindent 4 }}
    app.kubernetes.io/component: ragflow
spec:
  selector:
    {{- include "ragflow.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: ragflow
  ports:
    - protocol: TCP
      port: 80
      targetPort: http
      name: http
  type: {{ .Values.ragflow.service.type }}
---
{{- if .Values.ragflow.api.service.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-api
  labels:
    {{- include "ragflow.labels" . | nindent 4 }}
    app.kubernetes.io/component: ragflow
spec:
  selector:
    {{- include "ragflow.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: ragflow
  ports:
    - protocol: TCP
      port: 80
      targetPort: http-api
      name: http-api
  type: {{ .Values.ragflow.api.service.type }}
{{- end }}

{{- if .Values.ragflow.admin.enabled }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-admin
  labels:
    {{- include "ragflow.labels" . | nindent 4 }}
    app.kubernetes.io/component: ragflow
spec:
  selector:
    {{- include "ragflow.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: ragflow
  ports:
    - protocol: TCP
      port: {{ .Values.ragflow.admin.port }}
      targetPort: admin
      name: admin
  type: {{ .Values.ragflow.admin.serviceType }}
{{- end }}

{{- if .Values.ragflow.mcp.enabled }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-mcp
  labels:
    {{- include "ragflow.labels" . | nindent 4 }}
    app.kubernetes.io/component: ragflow
spec:
  selector:
    {{- include "ragflow.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: ragflow
  ports:
    - protocol: TCP
      port: {{ .Values.ragflow.mcp.port }}
      targetPort: mcp
      name: mcp
  type: {{ .Values.ragflow.mcp.service.type }}

{{- if and (eq .Values.ragflow.mcp.mode "self-host") (not .Values.ragflow.mcp.existingSecret) }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "ragflow.fullname" . }}-mcp
  labels:
    {{- include "ragflow.labels" . | nindent 4 }}
    app.kubernetes.io/component: ragflow
type: Opaque
stringData:
  host-api-key: {{ required "ragflow.mcp.hostApiKey is required when mode=self-host and no existingSecret is provided" .Values.ragflow.mcp.hostApiKey | quote }}
{{- end }}
{{- end }}
